in Azure during seasonal peaks (\"cloud bursting\"). Which model enables this?"],"options":[{"key":"A","text":"Private cloud only"},{"key":"B","text":"Hybrid cloud"},{"key":"C","text":"Public cloud only"},{"key":"D","text":"SaaS"}],"answer":"B","explanation":["Hybrid cloud allows bursting into the public cloud when local capacity runs out."]},{"id":109,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which statement best describes a benefit of PaaS for developers?"],"options":[{"key":"A","text":"They are responsible for physical security"},{"key":"B","text":"They don't need to manage infrastructure, so they can focus on application development"},{"key":"C","text":"They must manage OS licenses"},{"key":"D","text":"They get full control of the hypervisor"}],"answer":"B","explanation":["PaaS removes infrastructure management, speeding up development."]},{"id":110,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which of the following are typical use cases of IaaS? (Choose two.)"],"options":[{"key":"A","text":"Hosting legacy applications that need specific OS configurations"},{"key":"B","text":"Building apps without managing operating systems"},{"key":"C","text":"Testing and development environments that are quickly created and torn down"},{"key":"D","text":"Using Microsoft 365 email"}],"answer":"A, C","explanation":["IaaS is flexible for dev/test and for apps that need control of the OS."]},{"id":111,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which statement about the cloud and CapEx/OpEx is correct?"],"options":[{"key":"A","text":"CapEx costs are lower in the cloud because hardware is bought up-front"},{"key":"B","text":"OpEx cannot be deducted in the same year"},{"key":"C","text":"Cloud computing requires more CapEx than on-premises"},{"key":"D","text":"Cloud computing allows companies to shift from CapEx to OpEx"}],"answer":"D","explanation":["The cloud replaces up-front hardware purchases (CapEx) with ongoing service payments (OpEx)."]},{"id":112,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["In Azure, what does \"elasticity\" let you avoid?"],"options":[{"key":"A","text":"Using identity services"},{"key":"B","text":"Paying for storage"},{"key":"C","text":"Configuring network security"},{"key":"D","text":"Paying for idle capacity bought to cover peak demand"}],"answer":"D","explanation":["With elasticity you don't over-provision for peaks; resources scale with demand."]},{"id":113,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which cloud deployment model is the BEST choice when an organization requires complete control over its hardware and security for strict regulatory reasons?"],"options":[{"key":"A","text":"SaaS"},{"key":"B","text":"Serverless"},{"key":"C","text":"Private cloud"},{"key":"D","text":"Public cloud"}],"answer":"C","explanation":["The private cloud gives full control over hardware, security and configuration."]},{"id":114,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company runs a web application on Azure App Service and stores data in Azure SQL Database. Who is responsible for protecting the data in the database (for example, classification and access)?"],"options":[{"key":"A","text":"Nobody, PaaS data is automatically classified"},{"key":"B","text":"The internet service provider"},{"key":"C","text":"The customer"},{"key":"D","text":"Microsoft"}],"answer":"C","explanation":["Information and data are always the customer's responsibility."]},{"id":115,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which statement about the shared responsibility model for an on-premises datacenter is correct?"],"options":[{"key":"A","text":"The customer is responsible for everything, from physical security to data"},{"key":"B","text":"The hardware vendor is responsible for the data"},{"key":"C","text":"Microsoft is responsible for the physical security"},{"key":"D","text":"Responsibility is shared equally with Microsoft"}],"answer":"A","explanation":["On-premises, the organization owns every layer."]},{"id":116,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["In a PaaS solution, which responsibility is SHARED between the customer and Microsoft?"],"options":[{"key":"A","text":"Identity and directory infrastructure, applications and network controls"},{"key":"B","text":"Physical datacenter"},{"key":"C","text":"Physical hosts"},{"key":"D","text":"Information and data"}],"answer":"A","explanation":["In PaaS, applications, network controls and identity/directory infrastructure are shared; data and accounts remain the customer's; physical layers are Microsoft's."]},{"id":117,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which statement about multi-cloud is correct?"],"options":[{"key":"A","text":"Multi-cloud is the same as private cloud"},{"key":"B","text":"Multi-cloud requires all resources to run in one provider"},{"key":"C","text":"You can use Azure Arc to manage resources across multiple clouds from Azure"},{"key":"D","text":"Azure cannot interact with other clouds"}],"answer":"C","explanation":["Azure Arc provides a single control plane for resources in Azure, on-premises and other clouds."]},{"id":118,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company has a web store with predictable heavy traffic on Black Friday. It wants to scale for that day and then scale back. What is the key cloud benefit used?"],"options":[{"key":"A","text":"CapEx investment"},{"key":"B","text":"Vertical scaling of the physical datacenter"},{"key":"C","text":"Private cloud dedicated hardware"},{"key":"D","text":"Scalability with pay-as-you-go pricing"}],"answer":"D","explanation":["You add capacity only when needed and pay only for that period."]},{"id":119,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Serverless applications are billed only when the code runs (for example, per execution) in a consumption plan.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. The Azure Functions Consumption plan bills per execution and execution time."]},{"id":120,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Scaling up (vertical scaling) usually requires no change in the number of instances.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Vertical scaling changes the size of a resource, not the number of instances."]},{"id":121,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which is NOT a benefit of the cloud?"],"options":[{"key":"A","text":"Full physical control of the servers by the customer"},{"key":"B","text":"Global reach"},{"key":"C","text":"High availability"},{"key":"D","text":"Scalability"}],"answer":"A","explanation":["Physical control of servers is a private/on-premises characteristic, not a public cloud benefit."]},{"id":122,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is the main difference between scalability and elasticity?"],"options":[{"key":"A","text":"Elasticity only applies to storage"},{"key":"B","text":"Scalability is always automatic"},{"key":"C","text":"Elasticity is scalability that happens automatically in response to demand"},{"key":"D","text":"There is no difference"}],"answer":"C","explanation":["Scalability is the ability to scale; elasticity is doing it automatically."]},{"id":123,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO factors describe the cloud as a \"metered\" service? (Choose two.)"],"options":[{"key":"A","text":"Usage is measured"},{"key":"B","text":"You are billed based on what you consume"},{"key":"C","text":"You must buy licenses up-front"},{"key":"D","text":"You pay a fixed price regardless of usage"}],"answer":"A, B","explanation":["Measured service is one of the essential characteristics of cloud computing."]},{"id":124,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which cloud service model is BEST for a company that wants to host an application without worrying about OS updates, but still needs to write its own code?"],"options":[{"key":"A","text":"SaaS"},{"key":"B","text":"PaaS"},{"key":"C","text":"IaaS"},{"key":"D","text":"On-premises"}],"answer":"B","explanation":["SaaS wouldn't allow custom code; IaaS would require OS management. PaaS is in between."]},{"id":125,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company wants to migrate quickly to Azure without changing applications. Which approach and model fit best?"],"options":[{"key":"A","text":"Rehost (lift-and-shift) to IaaS virtual machines"},{"key":"B","text":"Rebuild as SaaS"},{"key":"C","text":"Replace with Microsoft 365"},{"key":"D","text":"Refactor to serverless functions"}],"answer":"A","explanation":["Rehosting existing servers onto Azure VMs requires minimal changes."]},{"id":126,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which statement about a public cloud is correct?"],"options":[{"key":"A","text":"Public cloud means the data is publicly visible on the internet"},{"key":"B","text":"Each customer receives dedicated physical datacenters"},{"key":"C","text":"Public cloud cannot be secured"},{"key":"D","text":"Many organizations share the same underlying hardware, but their data and resources are logically isolated"}],"answer":"D","explanation":["\"Public\" refers to the availability of services to anyone, not to the data being public."]},{"id":127,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which cloud concept describes resources being provisioned by the customer, without needing human interaction with the provider?"],"options":[{"key":"A","text":"Fault tolerance"},{"key":"B","text":"Self-service (on-demand self-service)"},{"key":"C","text":"Colocation"},{"key":"D","text":"Disaster recovery"}],"answer":"B","explanation":["You can create and delete resources yourself via the portal, CLI or APIs at any time."]},{"id":128,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which statement about the cloud and security is correct?"],"options":[{"key":"A","text":"Moving to the cloud makes the customer completely free of security responsibilities"},{"key":"B","text":"Security is never shared in the cloud"},{"key":"C","text":"Cloud providers offer security tools and patches that customers can use, but customers must still configure and protect their own data and identities"},{"key":"D","text":"Cloud providers are responsible for the customer's passwords"}],"answer":"C","explanation":["This is the shared responsibility model."]},{"id":129,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["In which service model does the customer manage the operating system, the runtime and the applications?"],"options":[{"key":"A","text":"SaaS"},{"key":"B","text":"PaaS"},{"key":"C","text":"Serverless"},{"key":"D","text":"IaaS"}],"answer":"D","explanation":["In IaaS the customer manages OS, middleware/runtime, applications and data."]},{"id":130,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company uses Azure Virtual Machines and wants to reduce administrative overhead for the OS. What should it consider?"],"options":[{"key":"A","text":"Moving the VMs to a private cloud"},{"key":"B","text":"Increasing the VM size"},{"key":"C","text":"Migrating the application to a PaaS service"},{"key":"D","text":"Adding more VMs"}],"answer":"C","explanation":["PaaS removes OS management from the customer."]},{"id":131,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO are examples of PaaS in Azure? (Choose two.)"],"options":[{"key":"A","text":"Azure App Service"},{"key":"B","text":"Microsoft 365"},{"key":"C","text":"Azure Virtual Machines"},{"key":"D","text":"Azure SQL Database"}],"answer":"A, D","explanation":["SQL Database and App Service are managed platforms. VMs are IaaS and Microsoft 365 is SaaS."]},{"id":132,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is a benefit of the hybrid cloud for organizations with existing hardware?"],"options":[{"key":"A","text":"It removes all compliance requirements"},{"key":"B","text":"They cannot connect on-premises resources to the cloud"},{"key":"C","text":"They must decommission all on-premises hardware"},{"key":"D","text":"They can continue using existing on-premises hardware while using cloud resources for new workloads"}],"answer":"D","explanation":["Hybrid cloud protects existing investments while adding cloud capabilities."]},{"id":133,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which cloud characteristic means you can access your services from anywhere with an internet connection and a variety of devices?"],"options":[{"key":"A","text":"Resource pooling"},{"key":"B","text":"Vertical scaling"},{"key":"C","text":"Measured service"},{"key":"D","text":"Broad network access"}],"answer":"D","explanation":["Broad network access is one of the essential characteristics of cloud computing."]},{"id":134,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Using the cloud, a company can avoid the cost of a datacenter that sits mostly idle outside peak periods.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Pay-as-you-go and elasticity remove the need to over-provision."]},{"id":135,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which of the following describes \"resource pooling\" in the cloud?"],"options":[{"key":"A","text":"Each customer gets dedicated hardware"},{"key":"B","text":"The provider's computing resources serve multiple customers, dynamically assigned according to demand"},{"key":"C","text":"Customers must share data with each other"},{"key":"D","text":"Resources are pooled only on-premises"}],"answer":"B","explanation":["Resource pooling (multi-tenancy) lets the provider achieve economies of scale."]},{"id":136,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which statement about IaaS costs is correct?"],"options":[{"key":"A","text":"IaaS costs are always fixed"},{"key":"B","text":"You pay for the compute, storage and networking resources you provision, for as long as they are allocated"},{"key":"C","text":"IaaS requires buying physical servers"},{"key":"D","text":"IaaS includes free OS management by Microsoft"}],"answer":"B","explanation":["IaaS is billed based on the resources you allocate (e.g., VM size per second/hour while running)."]},{"id":137,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company needs a solution where developers build apps, and the platform automatically handles scaling, load balancing and patching. Which model?"],"options":[{"key":"A","text":"On-premises virtualization"},{"key":"B","text":"IaaS"},{"key":"C","text":"SaaS"},{"key":"D","text":"PaaS"}],"answer":"D","explanation":["These platform capabilities are typical of PaaS offerings like App Service."]},{"id":138,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which statement about SaaS is correct?"],"options":[{"key":"A","text":"SaaS gives you full control of the OS"},{"key":"B","text":"SaaS requires you to install the app on your own servers"},{"key":"C","text":"SaaS requires you to manage the runtime"},{"key":"D","text":"SaaS is the least flexible model, because you use the software as offered by the provider"}],"answer":"D","explanation":["SaaS is easy to use but with limited customization."]},{"id":139,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Cost predictability in the cloud can be helped by tools such as the pricing calculator and Microsoft Cost Management.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. These tools help forecast and track spending."]},{"id":140,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Performance predictability in the cloud is helped by autoscaling, load balancing and high availability.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Those features let you predict and maintain performance."]},{"id":141,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements about the hybrid cloud are true? (Choose two.)"],"options":[{"key":"A","text":"It can only be implemented by Microsoft"},{"key":"B","text":"It requires abandoning all on-premises infrastructure"},{"key":"C","text":"It allows data and applications to be shared between environments"},{"key":"D","text":"It combines public and private clouds"}],"answer":"C, D","explanation":["Hybrid cloud = private + public with connectivity between them."]},{"id":142,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which is the best description of a Service Level Agreement (SLA)?"],"options":[{"key":"A","text":"A formal agreement that defines the performance standards (such as availability) the provider commits to and the credits if not met"},{"key":"B","text":"A security baseline for virtual machines"},{"key":"C","text":"A contract to buy reserved instances"},{"key":"D","text":"A document listing all Azure regions"}],"answer":"A","explanation":["SLAs describe uptime guarantees and service credits if the commitment isn't met."]},{"id":143,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What happens if Microsoft doesn't meet the SLA for a service?"],"options":[{"key":"A","text":"The customer may be eligible for a service credit (a percentage of the monthly fee)"},{"key":"B","text":"The customer gets the service free for one year"},{"key":"C","text":"Microsoft refunds all costs of the subscription"},{"key":"D","text":"Nothing; SLAs are not binding"}],"answer":"A","explanation":["SLA breaches generally result in service credits, which you usually need to request."]},{"id":144,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["An application requires 99.99% availability. How much downtime does this allow per month, approximately?"],"options":[{"key":"A","text":"About 7.2 hours"},{"key":"B","text":"About 43.8 minutes"},{"key":"C","text":"About 21.9 minutes"},{"key":"D","text":"About 4.4 minutes"}],"answer":"D","explanation":["99.99% ≈ 4.38 minutes/month; 99.95% ≈ 21.9 minutes; 99.9% ≈ 43.8 minutes; 99% ≈ 7.2 hours."]},{"id":145,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["An application requires 99.9% availability. How much downtime does this allow per month, approximately?"],"options":[{"key":"A","text":"About 8.8 hours"},{"key":"B","text":"About 43.8 minutes"},{"key":"C","text":"About 1 minute"},{"key":"D","text":"About 4.4 minutes"}],"answer":"B","explanation":["Each additional \"9\" reduces allowed downtime by a factor of ten. 99.9% ≈ 43.8 minutes per month."]},{"id":146,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["An application uses two services in series: a web app with a 99.95% SLA and a database with a 99.99% SLA. What is the composite SLA?"],"options":[{"key":"A","text":"99.95%"},{"key":"B","text":"About 99.94%"},{"key":"C","text":"99.99%"},{"key":"D","text":"199.94%"}],"answer":"B","explanation":["Composite SLA = 99.95% × 99.99% ≈ 99.94%. Depending on several services lowers total availability."]},{"id":147,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is an Azure region?"],"options":[{"key":"A","text":"A single datacenter"},{"key":"B","text":"A geographical area containing one or more datacenters networked together with a low-latency network"},{"key":"C","text":"A logical container for resources"},{"key":"D","text":"A billing unit"}],"answer":"B","explanation":["A region is a set of datacenters deployed within a latency-defined perimeter."]},{"id":148,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is an Azure availability zone?"],"options":[{"key":"A","text":"A pair of regions in the same geography"},{"key":"B","text":"A group of resource groups"},{"key":"C","text":"One or more physically separate datacenters within an Azure region, with independent power, cooling and networking"},{"key":"D","text":"A logical grouping of virtual machines in the same rack"}],"answer":"C","explanation":["Zones isolate failures within a region. Zone-enabled regions have a minimum of three zones."]},{"id":149,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is the minimum number of availability zones in an Azure region that supports availability zones?"],"options":[{"key":"A","text":"2"},{"key":"B","text":"4"},{"key":"C","text":"6"},{"key":"D","text":"3"}],"answer":"D","explanation":["Each zone-enabled region has at least three separate availability zones."]},{"id":150,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: All Azure regions support availability zones.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["No. Only some regions support availability zones; check the list before designing."]},{"id":151,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO types of Azure services relate to availability zones? (Choose two.)"],"options":[{"key":"A","text":"Paired services"},{"key":"B","text":"Zonal services (pinned to a specific zone, e.g., a VM)"},{"key":"C","text":"Zone-redundant services (replicated across zones automatically, e.g., ZRS storage)"},{"key":"D","text":"Regional-only services that cannot be used in a region"}],"answer":"B, C","explanation":["Azure also has non-regional services that are always available from Azure geographies."]},{"id":152,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is a region pair?"],"options":[{"key":"A","text":"Two subscriptions linked for billing"},{"key":"B","text":"Two availability zones in the same region"},{"key":"C","text":"Two regions within the same geography, usually at least 300 miles apart, paired for disaster recovery"},{"key":"D","text":"Two datacenters in the same building"}],"answer":"C","explanation":["Region pairs help with replication and recovery when a whole region is affected."]},{"id":153,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements about Azure region pairs are true? (Choose two.)"],"options":[{"key":"A","text":"Planned Azure updates are rolled out to paired regions one region at a time"},{"key":"B","text":"Data is always replicated automatically for every service"},{"key":"C","text":"Paired regions are always in different geographies"},{"key":"D","text":"If there is a broad outage, recovery of one region in each pair is prioritized"}],"answer":"A, D","explanation":["Updates are sequential across pairs, and one region per pair is prioritized for recovery. Replication depends on the service and configuration (e.g., GRS)."]},{"id":154,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Most region pairs are in the same geography to meet data residency requirements, but there are exceptions such as Brazil South.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Brazil South is paired with South Central US (outside its geography)."]},{"id":155,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Every Azure region has a paired region.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["No. Some newer regions don't have a pair and rely on availability zones for resiliency."]},{"id":156,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What are Azure sovereign regions?"],"options":[{"key":"A","text":"Instances of Azure isolated from the main instance, used for compliance or legal purposes, such as Azure Government (US) and Azure operated by 21Vianet (China)"},{"key":"B","text":"Regions with no availability zones"},{"key":"C","text":"Regions where data is not encrypted"},{"key":"D","text":"Regions reserved for Microsoft internal use"}],"answer":"A","explanation":["Sovereign clouds are physically and logically isolated, operated by screened personnel or local partners."]},{"id":157,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure offering is designed for US government agencies and their partners?"],"options":[{"key":"A","text":"Azure Stack Hub"},{"key":"B","text":"Azure Arc"},{"key":"C","text":"Azure Government"},{"key":"D","text":"Azure operated by 21Vianet"}],"answer":"C","explanation":["Azure Government is a separate instance of Azure for US federal, state and local agencies."]},{"id":158,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is a resource in Azure?"],"options":[{"key":"A","text":"A manageable item available through Azure, such as a VM, storage account, virtual network or database"},{"key":"B","text":"A Microsoft Entra tenant"},{"key":"C","text":"A region"},{"key":"D","text":"A billing account"}],"answer":"A","explanation":["Resources are the basic building blocks of Azure solutions."]},{"id":159,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is a resource group?"],"options":[{"key":"A","text":"A group of users in Microsoft Entra ID"},{"key":"B","text":"A logical container that holds related resources for an Azure solution"},{"key":"C","text":"A physical datacenter"},{"key":"D","text":"A collection of subscriptions"}],"answer":"B","explanation":["Resource groups let you manage, deploy and delete related resources together."]},{"id":160,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements about resource groups are true? (Choose two.)"],"options":[{"key":"A","text":"Resource groups can contain other resource groups"},{"key":"B","text":"Resource groups cannot be nested inside other resource groups"},{"key":"C","text":"A resource can belong to only one resource group at a time"},{"key":"D","text":"A resource can belong to multiple resource groups"}],"answer":"B, C","explanation":["Each resource belongs to exactly one RG, and RGs are flat (no nesting)."]},{"id":161,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Resources in a resource group can be located in a different region than the resource group itself.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. The RG location only stores its metadata; resources inside can be in any region."]},{"id":162,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Deleting a resource group deletes all the resources it contains.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. This is useful for cleaning up temporary environments, and dangerous in production (use locks)."]},{"id":163,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: You can move a resource from one resource group to another.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Most resource types can be moved between resource groups (and subscriptions). The resource's location does not change."]},{"id":164,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Permissions (RBAC) assigned at the resource group level are inherited by the resources inside it.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Access applied to an RG applies to everything in it."]},{"id":165,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is an Azure subscription?"],"options":[{"key":"A","text":"A type of storage account"},{"key":"B","text":"A logical unit of Azure services linked to an account; it is a billing boundary and an access control boundary"},{"key":"C","text":"A physical server in a datacenter"},{"key":"D","text":"A Microsoft Entra group"}],"answer":"B","explanation":["Subscriptions group resources for billing and access management."]},{"id":166,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO boundaries does an Azure subscription provide? (Choose two.)"],"options":[{"key":"A","text":"Network boundary"},{"key":"B","text":"Geographic boundary"},{"key":"C","text":"Access control boundary"},{"key":"D","text":"Billing boundary"}],"answer":"C, D","explanation":["Billing is generated per subscription, and access policies can be applied at subscription level."]},{"id":167,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company wants separate billing reports and separate access for its development and production environments. What should it create?"],"options":[{"key":"A","text":"Separate virtual networks only"},{"key":"B","text":"Separate subscriptions for development and production"},{"key":"C","text":"Separate tags"},{"key":"D","text":"Separate availability zones"}],"answer":"B","explanation":["Subscriptions give separate invoices and an access boundary."]},{"id":168,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: A Microsoft Entra tenant can be associated with multiple Azure subscriptions, but each subscription trusts only one tenant.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. One tenant can have many subscriptions; a subscription trusts exactly one tenant."]},{"id":169,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What are management groups used for?"],"options":[{"key":"A","text":"To group users for licensing"},{"key":"B","text":"To organize subscriptions and apply governance (policies and access) across multiple subscriptions"},{"key":"C","text":"To organize resources inside a resource group"},{"key":"D","text":"To replicate data between regions"}],"answer":"B","explanation":["Management groups sit above subscriptions; policies and RBAC applied to them are inherited."]},{"id":170,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which is the correct order of the Azure management hierarchy, from top to bottom?"],"options":[{"key":"A","text":"Subscriptions → Management groups → Resource groups → Resources"},{"key":"B","text":"Management groups → Subscriptions → Resource groups → Resources"},{"key":"C","text":"Resource groups → Subscriptions → Management groups → Resources"},{"key":"D","text":"Resources → Resource groups → Subscriptions → Management groups"}],"answer":"B","explanation":["Management groups contain subscriptions, which contain resource groups, which contain resources."]},{"id":171,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements about management groups are true? (Choose two.)"],"options":[{"key":"A","text":"A subscription can belong to several management groups at once"},{"key":"B","text":"Management groups can contain resources directly"},{"key":"C","text":"Each management group and subscription can have only one parent"},{"key":"D","text":"A management group tree can support up to six levels of depth (not including the root level and the subscription level)"}],"answer":"C, D","explanation":["Up to 10,000 management groups per directory, 6 levels deep, single parent each."]},{"id":172,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: An Azure Policy assigned at a management group applies to all subscriptions under it.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Policies and RBAC are inherited down the hierarchy."]},{"id":173,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure compute service provides the MOST control over the operating system?"],"options":[{"key":"A","text":"Azure Functions"},{"key":"B","text":"Azure Virtual Machines"},{"key":"C","text":"Azure App Service"},{"key":"D","text":"Azure Container Instances"}],"answer":"B","explanation":["VMs are IaaS: you control the OS, installed software and configuration."]},{"id":174,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO scenarios are good reasons to use Azure Virtual Machines? (Choose two.)"],"options":[{"key":"A","text":"You are migrating existing on-premises servers with minimal changes (lift-and-shift)"},{"key":"B","text":"You want a fully serverless solution billed per execution"},{"key":"C","text":"You need full control of the OS, for example to install custom software"},{"key":"D","text":"You want to avoid managing operating systems"}],"answer":"A, C","explanation":["VMs suit lift-and-shift, custom OS needs, dev/test and DR scenarios."]},{"id":175,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What are Azure Virtual Machine Scale Sets?"],"options":[{"key":"A","text":"A pricing option for discounted VMs"},{"key":"B","text":"A set of VMs in different subscriptions"},{"key":"C","text":"A way to deploy and manage a group of identical, load-balanced VMs that can scale automatically"},{"key":"D","text":"A backup solution for VMs"}],"answer":"C","explanation":["Scale sets automate scaling in/out based on demand or schedule."]},{"id":176,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What are availability sets used for?"],"options":[{"key":"A","text":"To group VMs for billing"},{"key":"B","text":"To replicate VMs to another region"},{"key":"C","text":"To protect VMs from hardware failures and planned maintenance within a datacenter by spreading them across fault domains and update domains"},{"key":"D","text":"To reduce VM costs"}],"answer":"C","explanation":["Availability sets spread VMs across fault domains (rack/power) and update domains (maintenance groups)."]},{"id":177,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["In an availability set, what is a fault domain?"],"options":[{"key":"A","text":"A group of VMs that share a common power source and network switch (like a rack)"},{"key":"B","text":"A virtual network subnet"},{"key":"C","text":"A group of VMs that are rebooted together for maintenance"},{"key":"D","text":"A region pair"}],"answer":"A","explanation":["Fault domains protect against hardware/rack failures. Up to 3 fault domains per availability set."]},{"id":178,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["In an availability set, what is an update domain?"],"options":[{"key":"A","text":"A group of VMs that share a power source"},{"key":"B","text":"A group of storage accounts"},{"key":"C","text":"A group of VMs that can be rebooted at the same time during planned maintenance"},{"key":"D","text":"A separate region"}],"answer":"C","explanation":["Only one update domain is rebooted at a time during planned maintenance. Up to 20 update domains."]},{"id":179,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: An availability set protects your VMs from the failure of an entire datacenter.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["No. Availability sets work within a single datacenter. For datacenter failure use availability zones."]},{"id":180,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service provides a desktop and app virtualization service running in the cloud, including multi-session Windows 11?"],"options":[{"key":"A","text":"Windows 365 Business only"},{"key":"B","text":"Azure Bastion"},{"key":"C","text":"Azure Virtual Machines"},{"key":"D","text":"Azure Virtual Desktop"}],"answer":"D","explanation":["Azure Virtual Desktop delivers virtualized desktops and apps; it supports Windows 10/11 Enterprise multi-session."]},{"id":181,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO are benefits of Azure Virtual Desktop? (Choose two.)"],"options":[{"key":"A","text":"Multi-session Windows, allowing multiple users to share one VM"},{"key":"B","text":"It removes the need for any identity solution"},{"key":"C","text":"Centralized security and management of user desktops, with data kept in the cloud instead of on the device"},{"key":"D","text":"It runs only on Windows devices"}],"answer":"A, C","explanation":["Users can connect from many devices (Windows, macOS, iOS, Android, web)."]},{"id":182,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is a container?"],"options":[{"key":"A","text":"A storage account type"},{"key":"B","text":"A Microsoft Entra group"},{"key":"C","text":"A lightweight, virtualized environment that packages an application with its dependencies and shares the host OS kernel"},{"key":"D","text":"A full virtual machine with its own OS"}],"answer":"C","explanation":["Containers are lighter than VMs and start much faster, because they don't include a full OS."]},{"id":183,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure service is the fastest and simplest way to run a single container in Azure without managing VMs or orchestration?"],"options":[{"key":"A","text":"Azure Virtual Desktop"},{"key":"B","text":"Azure Virtual Machines"},{"key":"C","text":"Azure Kubernetes Service (AKS)"},{"key":"D","text":"Azure Container Instances (ACI)"}],"answer":"D","explanation":["ACI is PaaS for containers: upload a container image and it runs."]},{"id":184,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure service is a managed orchestration service for deploying and managing many containers at scale?"],"options":[{"key":"A","text":"Azure Kubernetes Service (AKS)"},{"key":"B","text":"Azure Batch"},{"key":"C","text":"Azure Functions"},{"key":"D","text":"Azure Container Instances"}],"answer":"A","explanation":["AKS is managed Kubernetes for orchestrating containerized applications."]},{"id":185,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure service is a serverless platform for running microservices and containerized apps, with automatic scaling and load balancing, without managing Kubernetes?"],"options":[{"key":"A","text":"Azure Container Apps"},{"key":"B","text":"Azure Virtual Machines"},{"key":"C","text":"Azure Container Instances"},{"key":"D","text":"Azure Dedicated Host"}],"answer":"A","explanation":["Container Apps adds features such as autoscaling (including to zero) and load balancing on top of a serverless container platform."]},{"id":186,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements describe containers compared to virtual machines? (Choose two.)"],"options":[{"key":"A","text":"Containers virtualize the operating system, while VMs virtualize the hardware"},{"key":"B","text":"Containers include a full guest OS"},{"key":"C","text":"Containers cannot be scaled"},{"key":"D","text":"Containers start faster"}],"answer":"A, D","explanation":["VMs run a full OS on virtual hardware; containers share the host kernel."]},{"id":187,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is Azure Functions?"],"options":[{"key":"A","text":"A VM size optimized for compute"},{"key":"B","text":"An event-driven, serverless compute option that runs code in response to events such as HTTP requests, timers or messages"},{"key":"C","text":"A storage service for functions"},{"key":"D","text":"An identity service"}],"answer":"B","explanation":["Functions scale automatically and you pay only for execution time in the Consumption plan."]},{"id":188,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements about Azure Functions are true? (Choose two.)"],"options":[{"key":"A","text":"Functions require you to manage the underlying VMs"},{"key":"B","text":"Functions only run once a day"},{"key":"C","text":"Functions scale automatically based on demand"},{"key":"D","text":"Functions can be stateless or stateful (Durable Functions)"}],"answer":"C, D","explanation":["Functions are stateless by default; Durable Functions add state."]},{"id":189,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure service is a fully managed platform for hosting web apps, REST APIs and mobile back ends?"],"options":[{"key":"A","text":"Azure Batch"},{"key":"B","text":"Azure Virtual Machines"},{"key":"C","text":"Azure Kubernetes Service"},{"key":"D","text":"Azure App Service"}],"answer":"D","explanation":["App Service supports .NET, Java, Node.js, Python, PHP and more, on Windows or Linux."]},{"id":190,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO types of apps can be hosted in Azure App Service? (Choose two.)"],"options":[{"key":"A","text":"Web apps"},{"key":"B","text":"API apps"},{"key":"C","text":"Physical servers"},{"key":"D","text":"Desktop Windows applications installed on user PCs"}],"answer":"A, B","explanation":["App Service hosts web apps, API apps, WebJobs and mobile back ends."]},{"id":191,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["You need to run a background task every night at 2:00 AM with code, paying only while it runs. Which service is the best fit?"],"options":[{"key":"A","text":"Azure Virtual Desktop"},{"key":"B","text":"Azure DNS"},{"key":"C","text":"An Azure VM that runs 24/7"},{"key":"D","text":"Azure Functions with a timer trigger"}],"answer":"D","explanation":["A timer trigger runs the function on a schedule; the Consumption plan bills per execution."]},{"id":192,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["You need to automate a business workflow that connects Office 365, Salesforce and SQL Server with little or no code. Which service should you use?"],"options":[{"key":"A","text":"Azure Container Instances"},{"key":"B","text":"Azure Virtual Machines"},{"key":"C","text":"Azure Logic Apps"},{"key":"D","text":"Azure Functions"}],"answer":"C","explanation":["Logic Apps is a low-code workflow designer with hundreds of connectors."]},{"id":193,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is Azure Batch used for?"],"options":[{"key":"A","text":"Storing files"},{"key":"B","text":"Running large-scale parallel and high-performance computing (HPC) jobs"},{"key":"C","text":"Managing identities"},{"key":"D","text":"Hosting websites"}],"answer":"B","explanation":["Batch creates and manages a pool of compute nodes to run many tasks in parallel."]},{"id":194,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is an Azure virtual network (VNet)?"],"options":[{"key":"A","text":"A DNS zone"},{"key":"B","text":"A physical network cable in an Azure datacenter"},{"key":"C","text":"A logically isolated network in Azure that lets Azure resources communicate with each other, the internet and on-premises networks"},{"key":"D","text":"A VPN device"}],"answer":"C","explanation":["VNets provide isolation, segmentation, internet communication, on-premises connectivity, and traffic filtering and routing."]},{"id":195,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO capabilities are provided by Azure virtual networks? (Choose two.)"],"options":[{"key":"A","text":"Automatic data backup"},{"key":"B","text":"Cost analysis"},{"key":"C","text":"Isolation and segmentation using address spaces and subnets"},{"key":"D","text":"Communication between Azure resources"}],"answer":"C, D","explanation":["VNets also provide on-premises connectivity, routing and filtering."]},{"id":196,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What should you use to filter inbound and outbound network traffic to Azure resources in a virtual network based on IP address, port and protocol?"],"options":[{"key":"A","text":"A route table"},{"key":"B","text":"A network security group (NSG)"},{"key":"C","text":"A resource lock"},{"key":"D","text":"Azure DNS"}],"answer":"B","explanation":["NSGs contain allow/deny security rules, associated with subnets or network interfaces."]},{"id":197,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is virtual network peering?"],"options":[{"key":"A","text":"A connection between two virtual networks so resources can communicate privately over the Microsoft backbone network"},{"key":"B","text":"A load balancer"},{"key":"C","text":"A DNS service"},{"key":"D","text":"A VPN over the public internet"}],"answer":"A","explanation":["Peering (including global peering across regions) uses private Microsoft backbone, not the internet."]},{"id":198,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Traffic between peered virtual networks travels over the public internet.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["No. Peered traffic stays on the Microsoft backbone network."]},{"id":199,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements about Azure VPN Gateway are true? (Choose two.)"],"options":[{"key":"A","text":"It provides a private connection that never uses the internet"},{"key":"B","text":"It supports site-to-site, point-to-site and VNet-to-VNet connections"},{"key":"C","text":"It is a DNS hosting service"},{"key":"D","text":"It sends encrypted traffic between an Azure VNet and an on-premises location over the public internet"}],"answer":"B, D","explanation":["VPN Gateway uses IPsec/IKE tunnels over the internet. ExpressRoute is the private option."]},{"id":200,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is a point-to-site VPN connection?"],"options":[{"key":"A","text":"A connection between an on-premises network and Azure through a VPN device"},{"key":"B","text":"A private dedicated connection"},{"key":"C","text":"A VPN connection from an individual client computer to an Azure virtual network"},{"key":"D","text":"A connection between two Azure regions"}],"answer":"C","explanation":["Point-to-site is for individual devices (e.g., remote workers). Site-to-site connects a whole network."]},{"id":201,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is a site-to-site VPN connection?"],"options":[{"key":"A","text":"A peering between two VNets"},{"key":"B","text":"A connection from a single laptop to Azure"},{"key":"C","text":"A private fiber connection that bypasses the internet"},{"key":"D","text":"A connection between an on-premises VPN device and an Azure VPN gateway"}],"answer":"D","explanation":["Site-to-site connects your on-premises network to Azure through an encrypted tunnel over the internet."]},{"id":202,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO types of VPN gateways exist in Azure? (Choose two.)"],"options":[{"key":"A","text":"Zone-based"},{"key":"B","text":"Policy-based"},{"key":"C","text":"Route-based"},{"key":"D","text":"Tag-based"}],"answer":"B, C","explanation":["Policy-based uses static IP rules; route-based uses routing tables (more common and flexible)."]},{"id":203,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure service provides a private, dedicated connection from an on-premises network to Azure that does NOT go over the public internet?"],"options":[{"key":"A","text":"Azure VPN Gateway"},{"key":"B","text":"Azure DNS"},{"key":"C","text":"Azure ExpressRoute"},{"key":"D","text":"Azure Front Door"}],"answer":"C","explanation":["ExpressRoute uses a connectivity provider and offers more reliability, faster speeds and lower latency than internet VPNs."]},{"id":204,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO are benefits of Azure ExpressRoute? (Choose two.)"],"options":[{"key":"A","text":"Connectivity to Microsoft cloud services across all regions in the geopolitical region"},{"key":"B","text":"It is free of charge"},{"key":"C","text":"Traffic is always encrypted over the public internet by default"},{"key":"D","text":"Built-in redundancy and predictable performance"}],"answer":"A, D","explanation":["ExpressRoute also offers Global Reach (connecting on-premises sites through ExpressRoute) and dynamic routing with BGP."]},{"id":205,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which ExpressRoute feature lets you connect your on-premises sites to each other through the Microsoft network?"],"options":[{"key":"A","text":"ExpressRoute Global Reach"},{"key":"B","text":"VNet peering"},{"key":"C","text":"Point-to-site VPN"},{"key":"D","text":"Azure DNS private zones"}],"answer":"A","explanation":["Global Reach links ExpressRoute circuits to exchange data between on-premises sites."]},{"id":206,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements about Azure DNS are true? (Choose two.)"],"options":[{"key":"A","text":"It hosts DNS domains and provides name resolution using Microsoft Azure infrastructure"},{"key":"B","text":"It supports private DNS zones for name resolution inside virtual networks"},{"key":"C","text":"It lets you buy (register) domain names"},{"key":"D","text":"It is a content delivery network"}],"answer":"A, B","explanation":["Azure DNS hosts zones but doesn't register domains (you buy them from a registrar; App Service domains can be bought separately)."]},{"id":207,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is a public endpoint of an Azure service?"],"options":[{"key":"A","text":"An endpoint with a public IP address, accessible from anywhere on the internet"},{"key":"B","text":"A VPN connection"},{"key":"C","text":"An endpoint for DNS only"},{"key":"D","text":"An endpoint only reachable from a virtual network"}],"answer":"A","explanation":["Public endpoints are reachable over the internet (they can still be restricted with firewalls)."]},{"id":208,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What does Azure Private Link (a private endpoint) provide?"],"options":[{"key":"A","text":"A public IP for a storage account"},{"key":"B","text":"Access to Azure PaaS services through a private IP address in your virtual network"},{"key":"C","text":"Free bandwidth between regions"},{"key":"D","text":"A DDoS protection plan"}],"answer":"B","explanation":["Private endpoints bring the service into your VNet, so traffic stays on the Microsoft network."]},{"id":209,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service distributes network traffic across multiple virtual machines at layer 4 (TCP/UDP)?"],"options":[{"key":"A","text":"Azure DNS"},{"key":"B","text":"Azure Application Gateway"},{"key":"C","text":"Azure Load Balancer"},{"key":"D","text":"Azure Front Door"}],"answer":"C","explanation":["Load Balancer operates at layer 4. Application Gateway is a layer-7 (HTTP) load balancer with a WAF option."]},{"id":210,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service is a layer-7 web traffic load balancer that can include a web application firewall (WAF)?"],"options":[{"key":"A","text":"Azure ExpressRoute"},{"key":"B","text":"Azure VPN Gateway"},{"key":"C","text":"Azure Application Gateway"},{"key":"D","text":"Azure Load Balancer"}],"answer":"C","explanation":["Application Gateway routes based on HTTP attributes like URL path and host header."]},{"id":211,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service provides a global entry point for web apps with acceleration, load balancing across regions and CDN capabilities?"],"options":[{"key":"A","text":"VNet peering"},{"key":"B","text":"Azure DNS"},{"key":"C","text":"Azure Load Balancer"},{"key":"D","text":"Azure Front Door"}],"answer":"D","explanation":["Front Door is a global, layer-7 service at Microsoft's edge."]},{"id":212,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service routes traffic across regions using DNS, based on routing methods such as priority, performance or geographic?"],"options":[{"key":"A","text":"Azure Application Gateway"},{"key":"B","text":"Network security group"},{"key":"C","text":"Azure Traffic Manager"},{"key":"D","text":"Azure Bastion"}],"answer":"C","explanation":["Traffic Manager is a DNS-based global traffic load balancer."]},{"id":213,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service provides secure RDP and SSH access to VMs through the Azure portal without exposing public IP addresses on the VMs?"],"options":[{"key":"A","text":"Azure Firewall"},{"key":"B","text":"Azure Bastion"},{"key":"C","text":"Azure Front Door"},{"key":"D","text":"Azure VPN Gateway"}],"answer":"B","explanation":["Bastion is a managed jump host using TLS over the browser."]},{"id":214,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service is a managed, cloud-based network security service (stateful firewall) that protects Azure Virtual Network resources?"],"options":[{"key":"A","text":"Azure Firewall"},{"key":"B","text":"Microsoft Defender for Cloud"},{"key":"C","text":"Azure Key Vault"},{"key":"D","text":"Network security group"}],"answer":"A","explanation":["Azure Firewall offers centralized policy with application and network rules, threat intelligence, and DNAT."]},{"id":215,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service helps protect Azure resources against distributed denial of service attacks, with adaptive tuning and attack analytics?"],"options":[{"key":"A","text":"Azure DDoS Protection"},{"key":"B","text":"Azure Firewall"},{"key":"C","text":"Microsoft Sentinel"},{"key":"D","text":"Azure Key Vault"}],"answer":"A","explanation":["DDoS Protection (network or IP protection tiers) mitigates volumetric and protocol attacks."]},{"id":216,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company needs to run a VM on a physical server that is dedicated to its organization only, for compliance reasons. What should it use?"],"options":[{"key":"A","text":"Availability sets"},{"key":"B","text":"Azure Spot Virtual Machines"},{"key":"C","text":"Azure Container Instances"},{"key":"D","text":"Azure Dedicated Host"}],"answer":"D","explanation":["Dedicated Host provides single-tenant physical servers."]},{"id":217,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements about VM sizing are true? (Choose two.)"],"options":[{"key":"A","text":"You can resize a VM to a bigger or smaller size later"},{"key":"B","text":"VM size determines CPU, memory and cost"},{"key":"C","text":"All VM sizes have the same price"},{"key":"D","text":"VM size cannot be changed after creation"}],"answer":"A, B","explanation":["Resizing may require a restart."]},{"id":218,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO resources are typically needed when you create an Azure VM? (Choose two.)"],"options":[{"key":"A","text":"A virtual network"},{"key":"B","text":"A disk (managed disk) for the OS"},{"key":"C","text":"A Microsoft Entra Domain Services instance"},{"key":"D","text":"An ExpressRoute circuit"}],"answer":"A, B","explanation":["A VM also needs a network interface and, optionally, a public IP."]},{"id":219,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["You want a website on Azure to automatically handle more requests by adding instances when CPU is high. Which App Service feature should you use?"],"options":[{"key":"A","text":"Autoscale (scale out)"},{"key":"B","text":"Deployment slots"},{"key":"C","text":"Backup"},{"key":"D","text":"Custom domains"}],"answer":"A","explanation":["App Service plans can scale out manually or with autoscale rules."]},{"id":220,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What are deployment slots in Azure App Service used for?"],"options":[{"key":"A","text":"Assigning a public IP"},{"key":"B","text":"Deploying a new version to a staging slot and swapping it into production with minimal downtime"},{"key":"C","text":"Scheduling backups"},{"key":"D","text":"Adding more CPU"}],"answer":"B","explanation":["Slots let you test and warm up before swapping to production."]},{"id":221,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which compute option would you choose to run a Windows Server application that requires a specific third-party driver installed on the OS?"],"options":[{"key":"A","text":"Azure Virtual Machines"},{"key":"B","text":"Azure Functions"},{"key":"C","text":"Azure Logic Apps"},{"key":"D","text":"Azure App Service"}],"answer":"A","explanation":["Only IaaS VMs allow you to install arbitrary drivers and system software."]},{"id":222,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Azure Container Instances requires you to manage the underlying virtual machines.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["No. ACI is PaaS; Azure manages the infrastructure."]},{"id":223,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Azure Functions can be triggered by a new message in an Azure Storage queue.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Functions support many triggers: HTTP, timer, queues, blobs, Event Grid, Service Bus, etc."]},{"id":224,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: A subnet is a range of IP addresses within a virtual network.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Subnets segment a VNet into smaller networks."]},{"id":225,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: By default, resources in different subnets of the same virtual network can communicate with each other.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Routing between subnets of the same VNet is automatic; use NSGs to restrict it."]},{"id":226,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: By default, resources in two different virtual networks can communicate with each other without any configuration.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["No. You must connect them, for example with VNet peering or a VPN gateway."]},{"id":227,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["You need to connect 50 remote employees' laptops securely to an Azure virtual network. What should you configure?"],"options":[{"key":"A","text":"VNet peering"},{"key":"B","text":"A site-to-site VPN"},{"key":"C","text":"ExpressRoute Global Reach"},{"key":"D","text":"A point-to-site VPN"}],"answer":"D","explanation":["Point-to-site VPN connects individual devices."]},{"id":228,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Your company requires a connection to Azure with guaranteed bandwidth and low latency that doesn't traverse the internet. What should you recommend?"],"options":[{"key":"A","text":"Site-to-site VPN"},{"key":"B","text":"Azure Bastion"},{"key":"C","text":"Point-to-site VPN"},{"key":"D","text":"ExpressRoute"}],"answer":"D","explanation":["ExpressRoute provides a private connection through a connectivity provider."]},{"id":229,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements about network security groups are true? (Choose two.)"],"options":[{"key":"A","text":"An NSG encrypts traffic"},{"key":"B","text":"NSG rules are processed in priority order, lowest number first"},{"key":"C","text":"An NSG can only be associated with a VNet peering"},{"key":"D","text":"An NSG can be associated with a subnet or a network interface"}],"answer":"B, D","explanation":["Rules are evaluated by priority (100–4096); the first match wins."]},{"id":230,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service allows you to create a cloud-based HPC job with thousands of VMs that are created and removed automatically?"],"options":[{"key":"A","text":"Azure App Service"},{"key":"B","text":"Azure DNS"},{"key":"C","text":"Azure Batch"},{"key":"D","text":"Azure Virtual Desktop"}],"answer":"C","explanation":["Batch handles provisioning and scheduling for large parallel workloads."]},{"id":231,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure service lets you build event-driven apps that react to events from Azure services (such as a blob being created) using a publish-subscribe model?"],"options":[{"key":"A","text":"Azure Bastion"},{"key":"B","text":"Azure Policy"},{"key":"C","text":"Azure Load Balancer"},{"key":"D","text":"Azure Event Grid"}],"answer":"D","explanation":["Event Grid routes events from sources to handlers such as Functions or Logic Apps."]},{"id":232,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements about region selection are correct? (Choose two.)"],"options":[{"key":"A","text":"Choosing a region close to your users reduces latency"},{"key":"B","text":"Prices are identical in all regions"},{"key":"C","text":"All services are available in all regions"},{"key":"D","text":"Service availability and prices can vary by region"}],"answer":"A, D","explanation":["Check product availability by region and compare pricing."]},{"id":233,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is the purpose of Azure Edge Zones / Azure Stack products in general?"],"options":[{"key":"A","text":"To replace Microsoft Entra ID"},{"key":"B","text":"To reduce the price of Azure VMs"},{"key":"C","text":"To bring Azure services closer to the edge or on-premises for low latency or disconnected scenarios"},{"key":"D","text":"To manage billing"}],"answer":"C","explanation":["Azure Stack (Hub, HCI/Azure Local, Edge) extends Azure services to on-premises and edge locations."]},{"id":234,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which compute option is BEST for an app consisting of many microservices packaged as containers that need orchestration, service discovery and rolling updates, where the team wants full Kubernetes API access?"],"options":[{"key":"A","text":"Azure Kubernetes Service"},{"key":"B","text":"Azure Virtual Desktop"},{"key":"C","text":"Azure Container Instances"},{"key":"D","text":"Azure Functions"}],"answer":"A","explanation":["AKS gives managed Kubernetes with full API access."]},{"id":235,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company wants users to access a legacy Windows application from Mac and iPad devices without installing it locally. Which service should it use?"],"options":[{"key":"A","text":"Azure Logic Apps"},{"key":"B","text":"Azure Virtual Desktop"},{"key":"C","text":"Azure Functions"},{"key":"D","text":"Azure DNS"}],"answer":"B","explanation":["AVD streams Windows apps and desktops to many types of devices."]},{"id":236,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO services can provide connectivity between an on-premises network and Azure? (Choose two.)"],"options":[{"key":"A","text":"Azure VPN Gateway"},{"key":"B","text":"Azure DNS"},{"key":"C","text":"Azure Bastion"},{"key":"D","text":"Azure ExpressRoute"}],"answer":"A, D","explanation":["VPN Gateway (over internet) and ExpressRoute (private) are the hybrid connectivity options."]},{"id":237,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is an Azure storage account?"],"options":[{"key":"A","text":"A billing account for storage"},{"key":"B","text":"A container that groups Azure Storage services (Blob, Files, Queue, Table) under a unique namespace"},{"key":"C","text":"A virtual machine disk"},{"key":"D","text":"A Microsoft Entra user who can access storage"}],"answer":"B","explanation":["The storage account provides a unique namespace accessible over HTTP/HTTPS."]},{"id":238,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements about storage account names are true? (Choose two.)"],"options":[{"key":"A","text":"The name must be globally unique across Azure"},{"key":"B","text":"The name only needs to be unique within the subscription"},{"key":"C","text":"The name can contain uppercase letters and hyphens"},{"key":"D","text":"The name must be 3 to 24 characters using only lowercase letters and numbers"}],"answer":"A, D","explanation":["The name becomes part of the endpoint URL, e.g., https://mystorage.blob.core.windows.net."]},{"id":239,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure Storage service is optimized for storing massive amounts of unstructured data such as images, videos and backups?"],"options":[{"key":"A","text":"Azure Blob Storage"},{"key":"B","text":"Azure Table Storage"},{"key":"C","text":"Azure Files"},{"key":"D","text":"Azure Queue Storage"}],"answer":"A","explanation":["Blob = Binary Large Object storage for unstructured data."]},{"id":240,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure Storage service provides fully managed file shares accessible via SMB and NFS protocols?"],"options":[{"key":"A","text":"Azure Blob Storage"},{"key":"B","text":"Azure Files"},{"key":"C","text":"Azure Queue Storage"},{"key":"D","text":"Azure Disks"}],"answer":"B","explanation":["Azure Files shares can be mounted by cloud or on-premises Windows, Linux and macOS machines."]},{"id":241,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure Storage service is used to store large numbers of messages for asynchronous communication between application components?"],"options":[{"key":"A","text":"Azure Blob Storage"},{"key":"B","text":"Azure Files"},{"key":"C","text":"Azure Queue Storage"},{"key":"D","text":"Azure Table Storage"}],"answer":"C","explanation":["Queue messages can be up to 64 KB, and a queue can contain millions of messages."]},{"id":242,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure Storage service stores structured NoSQL data in a key/attribute store with a schemaless design?"],"options":[{"key":"A","text":"Azure Table Storage"},{"key":"B","text":"Azure Queue Storage"},{"key":"C","text":"Azure Files"},{"key":"D","text":"Azure Disks"}],"answer":"A","explanation":["Table Storage is good for flexible datasets such as user data, address books or device information."]},{"id":243,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure storage option provides block-level storage volumes for Azure virtual machines?"],"options":[{"key":"A","text":"Azure Files"},{"key":"B","text":"Azure Queue Storage"},{"key":"C","text":"Azure Disks (managed disks)"},{"key":"D","text":"Azure Blob Storage hot tier"}],"answer":"C","explanation":["Managed disks are like physical disks for VMs (Standard HDD, Standard SSD, Premium SSD, Ultra Disk)."]},{"id":244,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which redundancy option keeps three copies of your data within a single datacenter in the primary region?"],"options":[{"key":"A","text":"Geo-redundant storage (GRS)"},{"key":"B","text":"Locally redundant storage (LRS)"},{"key":"C","text":"Zone-redundant storage (ZRS)"},{"key":"D","text":"Geo-zone-redundant storage (GZRS)"}],"answer":"B","explanation":["LRS is the cheapest option but doesn't protect against a datacenter disaster."]},{"id":245,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which redundancy option replicates data synchronously across three availability zones in the primary region?"],"options":[{"key":"A","text":"Read-access geo-redundant storage (RA-GRS)"},{"key":"B","text":"Zone-redundant storage (ZRS)"},{"key":"C","text":"Locally redundant storage (LRS)"},{"key":"D","text":"Geo-redundant storage (GRS)"}],"answer":"B","explanation":["ZRS keeps data available if a zone becomes unavailable."]},{"id":246,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which redundancy option combines zone-redundant replication in the primary region with geo-replication to a secondary region?"],"options":[{"key":"A","text":"Geo-redundant storage (GRS)"},{"key":"B","text":"Zone-redundant storage (ZRS)"},{"key":"C","text":"Geo-zone-redundant storage (GZRS)"},{"key":"D","text":"Locally redundant storage (LRS)"}],"answer":"C","explanation":["GZRS = ZRS in primary + LRS in secondary. It offers maximum durability."]},{"id":247,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["You need to be able to READ your data from the secondary region even when the primary region is available. Which redundancy options support this? (Choose two.)"],"options":[{"key":"A","text":"RA-GRS"},{"key":"B","text":"ZRS"},{"key":"C","text":"GRS"},{"key":"D","text":"RA-GZRS"}],"answer":"A, D","explanation":["With GRS/GZRS the secondary is only accessible after failover; the RA- (read-access) versions allow reading at any time."]},{"id":248,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which redundancy option provides the LOWEST cost and the LEAST durability?"],"options":[{"key":"A","text":"GZRS"},{"key":"B","text":"ZRS"},{"key":"C","text":"GRS"},{"key":"D","text":"LRS"}],"answer":"D","explanation":["LRS: 3 copies in one datacenter (at least 11 nines of durability per year)."]},{"id":249,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: With geo-redundant storage (GRS), data is replicated synchronously to the secondary region.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["No. Replication to the secondary region is asynchronous; replication within the primary region is synchronous."]},{"id":250,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which blob access tier is optimized for data that is accessed frequently?"],"options":[{"key":"A","text":"Cool"},{"key":"B","text":"Archive"},{"key":"C","text":"Cold"},{"key":"D","text":"Hot"}],"answer":"D","explanation":["Hot has the highest storage cost and the lowest access cost."]},{"id":251,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which blob access tier is best for data that is infrequently accessed and stored for at least 30 days?"],"options":[{"key":"A","text":"Hot"},{"key":"B","text":"Cool"},{"key":"C","text":"Archive"},{"key":"D","text":"Premium"}],"answer":"B","explanation":["Cool has lower storage cost and higher access cost than Hot, with a 30-day minimum."]},{"id":252,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which blob access tier is best for data that is rarely accessed and stored for at least 90 days, but still needs to be available immediately (online)?"],"options":[{"key":"A","text":"Archive"},{"key":"B","text":"Cold"},{"key":"C","text":"Premium"},{"key":"D","text":"Hot"}],"answer":"B","explanation":["Cold is online with a 90-day minimum, cheaper storage than Cool."]},{"id":253,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which blob access tier has the lowest storage cost, is offline, and requires data to be stored for at least 180 days?"],"options":[{"key":"A","text":"Hot"},{"key":"B","text":"Cold"},{"key":"C","text":"Cool"},{"key":"D","text":"Archive"}],"answer":"D","explanation":["Archive data must be rehydrated (can take hours) before being read."]},{"id":254,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Access tiers (hot, cool, cold, archive) can be changed for a blob after it is uploaded.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. You can change tiers manually or automatically with lifecycle management policies."]},{"id":255,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO storage access tiers can be set at the storage ACCOUNT level as the default? (Choose two.)"],"options":[{"key":"A","text":"Archive"},{"key":"B","text":"Cool"},{"key":"C","text":"Hot"},{"key":"D","text":"Premium"}],"answer":"B, C","explanation":["Only Hot and Cool (and Cold in newer accounts) can be account defaults; Archive can only be set at the blob level."]},{"id":256,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which tool is a command-line utility used to copy blobs or files to or from a storage account?"],"options":[{"key":"A","text":"AzCopy"},{"key":"B","text":"Azure Data Box"},{"key":"C","text":"Azure Storage Explorer"},{"key":"D","text":"Azure File Sync"}],"answer":"A","explanation":["AzCopy supports uploads, downloads, copies between accounts and sync."]},{"id":257,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which tool provides a graphical interface to manage Azure Storage data on Windows, macOS and Linux?"],"options":[{"key":"A","text":"Azure CLI"},{"key":"B","text":"AzCopy"},{"key":"C","text":"Azure Migrate"},{"key":"D","text":"Azure Storage Explorer"}],"answer":"D","explanation":["Storage Explorer is a GUI that uses AzCopy behind the scenes for transfers."]},{"id":258,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service lets you centralize file shares in Azure Files while keeping the flexibility and performance of an on-premises Windows file server (caching)?"],"options":[{"key":"A","text":"Azure Data Box"},{"key":"B","text":"Azure Storage Explorer"},{"key":"C","text":"Azure File Sync"},{"key":"D","text":"AzCopy"}],"answer":"C","explanation":["File Sync turns Windows Server into a cache of your Azure file share, with cloud tiering."]},{"id":259,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service provides a unified hub to discover, assess and migrate on-premises servers, databases and web apps to Azure?"],"options":[{"key":"A","text":"Azure Arc"},{"key":"B","text":"Azure Data Box"},{"key":"C","text":"Azure Site Recovery only"},{"key":"D","text":"Azure Migrate"}],"answer":"D","explanation":["Azure Migrate includes discovery and assessment, server migration, database migration and more."]},{"id":260,"domain":"Architecture & s
