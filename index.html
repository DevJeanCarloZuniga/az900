ervices","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company needs to transfer 60 TB of data to Azure, but its internet connection is slow. Which service should it use?"],"options":[{"key":"A","text":"Azure File Sync"},{"key":"B","text":"AzCopy over the internet"},{"key":"C","text":"Azure Data Box"},{"key":"D","text":"Azure Storage Explorer"}],"answer":"C","explanation":["Data Box is a physical device (about 80 TB usable) shipped to you; you load data and ship it back."]},{"id":261,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO scenarios are good fits for Azure Data Box? (Choose two.)"],"options":[{"key":"A","text":"Exporting large amounts of data from Azure to on-premises for disaster recovery"},{"key":"B","text":"Real-time streaming of IoT data"},{"key":"C","text":"Hosting a website"},{"key":"D","text":"One-time migration of large amounts of data with limited network bandwidth"}],"answer":"A, D","explanation":["Data Box supports import and export scenarios."]},{"id":262,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO Azure database services are fully managed PaaS? (Choose two.)"],"options":[{"key":"A","text":"Azure Cosmos DB"},{"key":"B","text":"SQL Server on Azure Virtual Machines"},{"key":"C","text":"MySQL installed on an Azure VM"},{"key":"D","text":"Azure SQL Database"}],"answer":"A, D","explanation":["SQL Server or MySQL on a VM is IaaS; you manage the OS and engine."]},{"id":263,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure database service is a globally distributed, multi-model NoSQL database with single-digit millisecond latency?"],"options":[{"key":"A","text":"Azure Database for PostgreSQL"},{"key":"B","text":"Azure Cosmos DB"},{"key":"C","text":"Azure SQL Database"},{"key":"D","text":"Azure Table Storage"}],"answer":"B","explanation":["Cosmos DB supports multiple APIs (NoSQL, MongoDB, Cassandra, Gremlin, Table) and turnkey global distribution."]},{"id":264,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Inbound data transfer into Azure (ingress) is generally free.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Egress (data leaving Azure regions) is what is generally billed."]},{"id":265,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO types of storage account redundancy protect against a complete regional outage? (Choose two.)"],"options":[{"key":"A","text":"GZRS"},{"key":"B","text":"GRS"},{"key":"C","text":"LRS"},{"key":"D","text":"ZRS"}],"answer":"A, B","explanation":["Only geo-redundant options keep copies in a secondary region."]},{"id":266,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Azure Storage data is encrypted at rest by default.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Storage Service Encryption automatically encrypts data with 256-bit AES."]},{"id":267,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is Microsoft Entra ID (formerly Azure Active Directory)?"],"options":[{"key":"A","text":"A firewall"},{"key":"B","text":"A cloud-based identity and access management service"},{"key":"C","text":"An on-premises domain controller"},{"key":"D","text":"A database service"}],"answer":"B","explanation":["Entra ID lets users sign in to Microsoft 365, Azure portal and thousands of SaaS apps."]},{"id":268,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements describe differences between Microsoft Entra ID and on-premises Active Directory Domain Services (AD DS)? (Choose two.)"],"options":[{"key":"A","text":"Entra ID uses Group Policy and organizational units in the same way as AD DS"},{"key":"B","text":"Entra ID is designed for internet-based apps using protocols such as OAuth, SAML and OpenID Connect"},{"key":"C","text":"AD DS is a cloud service managed by Microsoft"},{"key":"D","text":"On-premises AD DS uses Kerberos, NTLM, LDAP and Group Policy"}],"answer":"B, D","explanation":["Entra ID is not a cloud version of AD DS; it's a different identity service for the cloud."]},{"id":269,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which tool synchronizes user identities from an on-premises Active Directory to Microsoft Entra ID?"],"options":[{"key":"A","text":"Microsoft Entra Domain Services"},{"key":"B","text":"Azure Migrate"},{"key":"C","text":"Microsoft Entra Connect"},{"key":"D","text":"Azure Arc"}],"answer":"C","explanation":["Entra Connect (and Entra Cloud Sync) synchronize users, groups and password hashes for hybrid identity."]},{"id":270,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company wants to run a legacy application in Azure that requires LDAP, Kerberos and Group Policy, without deploying and managing domain controllers. What should it use?"],"options":[{"key":"A","text":"Microsoft Entra ID only"},{"key":"B","text":"Microsoft Entra Connect"},{"key":"C","text":"Microsoft Entra Domain Services"},{"key":"D","text":"Azure Key Vault"}],"answer":"C","explanation":["Entra Domain Services provides managed domain services (domain join, group policy, LDAP, Kerberos/NTLM)."]},{"id":271,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is single sign-on (SSO)?"],"options":[{"key":"A","text":"Signing in without a password"},{"key":"B","text":"The ability to sign in once and access multiple applications without signing in again"},{"key":"C","text":"Using one password and one security question"},{"key":"D","text":"Requiring two forms of verification"}],"answer":"B","explanation":["SSO reduces the number of credentials users must remember and simplifies access management."]},{"id":272,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO are examples of factors that can be combined in multifactor authentication? (Choose two.)"],"options":[{"key":"A","text":"Something you have, such as a phone"},{"key":"B","text":"A password and a password hint"},{"key":"C","text":"Something you are, such as a fingerprint"},{"key":"D","text":"Two different passwords"}],"answer":"A, C","explanation":["MFA factors: something you know, something you have, something you are."]},{"id":273,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO are passwordless authentication methods supported by Microsoft Entra ID? (Choose two.)"],"options":[{"key":"A","text":"Windows Hello for Business"},{"key":"B","text":"SMS-only verification codes without a device"},{"key":"C","text":"Security questions"},{"key":"D","text":"FIDO2 security keys"}],"answer":"A, D","explanation":["Entra supports Windows Hello for Business, Microsoft Authenticator (passwordless sign-in/passkeys) and FIDO2 security keys."]},{"id":274,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company wants to invite partners from other organizations to access its SharePoint and apps using their own work accounts. Which Microsoft Entra feature should it use?"],"options":[{"key":"A","text":"Microsoft Entra Connect"},{"key":"B","text":"Microsoft Entra Domain Services"},{"key":"C","text":"Azure AD B2C local accounts only for employees"},{"key":"D","text":"Microsoft Entra B2B collaboration (external identities)"}],"answer":"D","explanation":["B2B collaboration lets external users sign in with their own credentials as guests."]},{"id":275,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company is building a customer-facing mobile app and wants customers to sign in with social accounts like Google or Facebook. Which identity solution should it use?"],"options":[{"key":"A","text":"Azure Key Vault"},{"key":"B","text":"Azure AD B2C / Microsoft Entra External ID for customers"},{"key":"C","text":"Microsoft Entra Domain Services"},{"key":"D","text":"Microsoft Entra Connect"}],"answer":"B","explanation":["Customer identity and access management (CIAM) solutions support social and local accounts for consumers."]},{"id":276,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What does Microsoft Entra Conditional Access do?"],"options":[{"key":"A","text":"Uses signals (user, location, device, application, risk) to make access decisions and enforce policies such as requiring MFA"},{"key":"B","text":"Encrypts data at rest"},{"key":"C","text":"Assigns Azure RBAC roles"},{"key":"D","text":"Synchronizes on-premises users"}],"answer":"A","explanation":["Conditional Access: signals → decision (allow, block, require MFA) → enforcement."]},{"id":277,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company wants to require MFA only when users sign in from outside the corporate network. What should it use?"],"options":[{"key":"A","text":"Network security groups"},{"key":"B","text":"Azure Policy"},{"key":"C","text":"Conditional Access"},{"key":"D","text":"Resource locks"}],"answer":"C","explanation":["Conditional Access policies can use location as a condition."]},{"id":278,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is Azure role-based access control (RBAC) used for?"],"options":[{"key":"A","text":"Monitoring performance"},{"key":"B","text":"Enforcing resource properties like allowed locations"},{"key":"C","text":"Encrypting VMs"},{"key":"D","text":"Managing who has access to Azure resources, what they can do with them, and at what scope"}],"answer":"D","explanation":["RBAC = who (security principal), what (role definition), where (scope)."]},{"id":279,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO are built-in Azure RBAC roles? (Choose two.)"],"options":[{"key":"A","text":"Reader"},{"key":"B","text":"Owner"},{"key":"C","text":"Global Administrator"},{"key":"D","text":"Billing Supervisor"}],"answer":"A, B","explanation":["Fundamental built-in roles: Owner, Contributor, Reader and User Access Administrator. Global Administrator is a Microsoft Entra role, not an Azure RBAC role."]},{"id":280,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure RBAC role can create and manage all types of resources but CANNOT grant access to others?"],"options":[{"key":"A","text":"User Access Administrator"},{"key":"B","text":"Owner"},{"key":"C","text":"Reader"},{"key":"D","text":"Contributor"}],"answer":"D","explanation":["Owner can do everything including assigning roles; Contributor can't manage access."]},{"id":281,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["At which TWO scopes can Azure RBAC roles be assigned? (Choose two.)"],"options":[{"key":"A","text":"Storage account access tier"},{"key":"B","text":"Resource group"},{"key":"C","text":"Management group"},{"key":"D","text":"Microsoft Entra tenant only"}],"answer":"B, C","explanation":["RBAC scopes: management group, subscription, resource group, resource."]},{"id":282,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Azure RBAC is an allow model: if one role assignment grants read access and another grants write access, the user has both.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Permissions are additive (deny assignments are a separate mechanism)."]},{"id":283,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is the principle of least privilege?"],"options":[{"key":"A","text":"Using only one administrator account"},{"key":"B","text":"Granting all users Owner access for convenience"},{"key":"C","text":"Granting users only the permissions they need to perform their job, and nothing more"},{"key":"D","text":"Removing all permissions from all users"}],"answer":"C","explanation":["Least privilege reduces the impact of compromised accounts."]},{"id":284,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO are principles of the Zero Trust model? (Choose two.)"],"options":[{"key":"A","text":"Grant permanent administrator access"},{"key":"B","text":"Assume breach"},{"key":"C","text":"Trust everything inside the corporate network"},{"key":"D","text":"Verify explicitly"}],"answer":"B, D","explanation":["The three principles: verify explicitly, use least privilege access, assume breach."]},{"id":285,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which security model assumes that everything inside and outside the corporate network is untrusted and every request must be authenticated and authorized?"],"options":[{"key":"A","text":"Defense in depth"},{"key":"B","text":"Shared responsibility"},{"key":"C","text":"Zero Trust"},{"key":"D","text":"Perimeter-only security"}],"answer":"C","explanation":["Zero Trust: \"never trust, always verify\"."]},{"id":286,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is defense in depth?"],"options":[{"key":"A","text":"A backup strategy"},{"key":"B","text":"A pricing model"},{"key":"C","text":"Using one strong firewall"},{"key":"D","text":"A layered security strategy where each layer protects the next, so that if one layer is breached, others still protect the data"}],"answer":"D","explanation":["Layers: physical security, identity & access, perimeter, network, compute, application, data."]},{"id":287,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["In the defense-in-depth model, which layer is at the center (the asset being protected)?"],"options":[{"key":"A","text":"Physical security"},{"key":"B","text":"Perimeter"},{"key":"C","text":"Network"},{"key":"D","text":"Data"}],"answer":"D","explanation":["Everything else surrounds and protects the data."]},{"id":288,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["In the defense-in-depth model, which layer includes controlling access to infrastructure with SSO and MFA, and auditing changes?"],"options":[{"key":"A","text":"Identity and access"},{"key":"B","text":"Compute"},{"key":"C","text":"Physical security"},{"key":"D","text":"Network"}],"answer":"A","explanation":["The identity and access layer ensures identities are secure and access is granted only as needed."]},{"id":289,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["In the defense-in-depth model, network segmentation and limiting communication between resources (for example with NSGs) is part of which layer?"],"options":[{"key":"A","text":"Network"},{"key":"B","text":"Data"},{"key":"C","text":"Physical security"},{"key":"D","text":"Perimeter"}],"answer":"A","explanation":["The network layer limits communication between resources and denies by default."]},{"id":290,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["In the defense-in-depth model, keeping VMs patched and secured (for example, closing unused ports and installing endpoint protection) is part of which layer?"],"options":[{"key":"A","text":"Perimeter"},{"key":"B","text":"Data"},{"key":"C","text":"Application"},{"key":"D","text":"Compute"}],"answer":"D","explanation":["The compute layer secures virtual machines and their access."]},{"id":291,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["In the defense-in-depth model, building security into the code and storing secrets securely is part of which layer?"],"options":[{"key":"A","text":"Network"},{"key":"B","text":"Physical security"},{"key":"C","text":"Application"},{"key":"D","text":"Compute"}],"answer":"C","explanation":["The application layer ensures apps are secure and free of vulnerabilities."]},{"id":292,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is Microsoft Defender for Cloud?"],"options":[{"key":"A","text":"A cost management tool"},{"key":"B","text":"An identity service"},{"key":"C","text":"A cloud security posture management (CSPM) and workload protection platform for Azure, hybrid and multi-cloud resources"},{"key":"D","text":"A backup service"}],"answer":"C","explanation":["It monitors security posture (secure score), provides recommendations and detects threats."]},{"id":293,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements about Microsoft Defender for Cloud are true? (Choose two.)"],"options":[{"key":"A","text":"It only works for on-premises servers"},{"key":"B","text":"It can protect resources in AWS and Google Cloud as well as Azure"},{"key":"C","text":"It replaces Microsoft Entra ID"},{"key":"D","text":"It provides a secure score that measures your security posture"}],"answer":"B, D","explanation":["Defender for Cloud covers Azure, on-premises (via Azure Arc) and other clouds."]},{"id":294,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service stores secrets, encryption keys and certificates, and can use hardware security modules (HSMs)?"],"options":[{"key":"A","text":"Azure Key Vault"},{"key":"B","text":"Azure Files"},{"key":"C","text":"Azure Policy"},{"key":"D","text":"Microsoft Sentinel"}],"answer":"A","explanation":["Key Vault centralizes secret management so applications don't store secrets in code."]},{"id":295,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service is Microsoft's cloud-native SIEM (security information and event management) solution?"],"options":[{"key":"A","text":"Microsoft Defender for Cloud"},{"key":"B","text":"Azure Monitor alerts"},{"key":"C","text":"Microsoft Sentinel"},{"key":"D","text":"Azure Firewall"}],"answer":"C","explanation":["Sentinel collects, detects, investigates and responds to threats across the enterprise."]},{"id":296,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: A Microsoft Entra ID user and an Azure RBAC role are the same thing.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["No. A user is an identity (security principal); a role defines a set of permissions assigned to that identity at a scope."]},{"id":297,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Microsoft Entra ID can be used to provide single sign-on to thousands of SaaS applications.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Entra ID has an application gallery with pre-integrated SaaS apps."]},{"id":298,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO Microsoft Entra ID features help protect against compromised credentials? (Choose two.)"],"options":[{"key":"A","text":"Resource locks"},{"key":"B","text":"Identity Protection (risk-based detection)"},{"key":"C","text":"Tags"},{"key":"D","text":"Multifactor authentication"}],"answer":"B, D","explanation":["Identity Protection detects risky sign-ins and users; MFA blocks most credential attacks."]},{"id":299,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is a security principal in Azure RBAC?"],"options":[{"key":"A","text":"A policy"},{"key":"B","text":"A role definition"},{"key":"C","text":"An object (user, group, service principal or managed identity) that requests access to Azure resources"},{"key":"D","text":"A scope"}],"answer":"C","explanation":["Role assignment = security principal + role definition + scope."]},{"id":300,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which identity type lets an Azure resource (such as a VM or function) authenticate to other Azure services without storing credentials in code?"],"options":[{"key":"A","text":"Shared access key"},{"key":"B","text":"Managed identity"},{"key":"C","text":"Guest user"},{"key":"D","text":"Local administrator account"}],"answer":"B","explanation":["Managed identities are automatically managed in Microsoft Entra ID."]},{"id":301,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service gives you managed Apache Spark, data warehousing and data integration in one analytics platform? (Choose the BEST answer.)"],"options":[{"key":"A","text":"Azure Table Storage"},{"key":"B","text":"Azure Files"},{"key":"C","text":"Azure DNS"},{"key":"D","text":"Azure Synapse Analytics"}],"answer":"D","explanation":["Synapse combines data warehousing and big data analytics. (Microsoft Fabric is the newer unified analytics SaaS.)"]},{"id":302,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO services can you use to protect against threats on the network perimeter? (Choose two.)"],"options":[{"key":"A","text":"Azure Firewall"},{"key":"B","text":"Azure Key Vault"},{"key":"C","text":"Microsoft Entra Connect"},{"key":"D","text":"Azure DDoS Protection"}],"answer":"A, D","explanation":["The perimeter layer uses DDoS protection and firewalls."]},{"id":303,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Physical security of Azure datacenters is the responsibility of Microsoft.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. It's the outermost defense-in-depth layer, managed by Microsoft."]},{"id":304,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which storage redundancy is NOT available if you need to replicate to a secondary region?"],"options":[{"key":"A","text":"GZRS"},{"key":"B","text":"GRS"},{"key":"C","text":"RA-GZRS"},{"key":"D","text":"ZRS"}],"answer":"D","explanation":["ZRS only replicates within the primary region across zones."]},{"id":305,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements about Azure Files are true? (Choose two.)"],"options":[{"key":"A","text":"File shares can be mounted concurrently by cloud and on-premises machines"},{"key":"B","text":"It can replace or supplement on-premises file servers"},{"key":"C","text":"It only supports Linux"},{"key":"D","text":"It cannot be accessed via SMB"}],"answer":"A, B","explanation":["Azure Files supports SMB (Windows, Linux, macOS) and NFS."]},{"id":306,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which storage solution should you use to store backups and archives that are kept for compliance for 7 years and almost never read?"],"options":[{"key":"A","text":"Blob storage in the Archive tier"},{"key":"B","text":"Blob storage in the Hot tier"},{"key":"C","text":"Premium SSD managed disks"},{"key":"D","text":"Azure Queue Storage"}],"answer":"A","explanation":["Archive is the cheapest tier for long-term, rarely accessed data."]},{"id":307,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What does lifecycle management in Azure Blob Storage let you do?"],"options":[{"key":"A","text":"Convert blobs to files"},{"key":"B","text":"Replicate blobs to another region"},{"key":"C","text":"Encrypt blobs with customer keys"},{"key":"D","text":"Automatically move blobs to cooler tiers or delete them based on rules such as age"}],"answer":"D","explanation":["For example: move to Cool after 30 days, to Archive after 180 days, delete after 7 years."]},{"id":308,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements about Microsoft Entra ID tenants are true? (Choose two.)"],"options":[{"key":"A","text":"A tenant is the same as a resource group"},{"key":"B","text":"A tenant is a dedicated instance of Microsoft Entra ID for an organization"},{"key":"C","text":"Each tenant has a default domain ending in .onmicrosoft.com"},{"key":"D","text":"Tenants are created per virtual machine"}],"answer":"B, C","explanation":["An organization gets a tenant when it signs up for a Microsoft cloud service."]},{"id":309,"domain":"Architecture & services","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which identity scenario describes users signing in to cloud apps with the same password as their on-premises account, without the cloud storing the password hash, by validating directly against on-premises AD?"],"options":[{"key":"A","text":"Guest access"},{"key":"B","text":"Azure AD B2C"},{"key":"C","text":"Pass-through authentication"},{"key":"D","text":"Password hash synchronization"}],"answer":"C","explanation":["Pass-through authentication validates passwords against on-premises AD through an agent. Password hash sync stores a hash of the hash in the cloud."]},{"id":310,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO factors can affect the cost of Azure resources? (Choose two.)"],"options":[{"key":"A","text":"Region (geography) where the resource is deployed"},{"key":"B","text":"The color theme selected in the portal"},{"key":"C","text":"The number of Microsoft Entra users in the tenant"},{"key":"D","text":"Resource type and size"}],"answer":"A, D","explanation":["Cost factors include resource type, consumption, maintenance, geography, network traffic, subscription type and Azure Marketplace purchases."]},{"id":311,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: The same Azure service can have different prices in different regions.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Power, labor, taxes and fees differ by location."]},{"id":312,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Data transfer between two Azure regions (inter-region traffic) can incur charges.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Bandwidth between regions and outbound to the internet is generally billed."]},{"id":313,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which pricing option lets you commit to a specific VM size and region for 1 or 3 years in exchange for a significant discount compared to pay-as-you-go?"],"options":[{"key":"A","text":"Azure Spot Virtual Machines"},{"key":"B","text":"Dev/Test pricing"},{"key":"C","text":"Azure Reservations (reserved instances)"},{"key":"D","text":"Azure Hybrid Benefit"}],"answer":"C","explanation":["Reservations can save up to about 72% for predictable, steady workloads."]},{"id":314,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which pricing option lets you commit to a fixed hourly spend on compute for 1 or 3 years, applied flexibly across VM sizes and regions?"],"options":[{"key":"A","text":"Spot Virtual Machines"},{"key":"B","text":"Azure Marketplace"},{"key":"C","text":"Azure Reservations"},{"key":"D","text":"Azure savings plan for compute"}],"answer":"D","explanation":["Savings plans are more flexible than reservations, typically with slightly smaller discounts."]},{"id":315,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company already owns Windows Server and SQL Server licenses with Software Assurance. Which benefit lets it reuse them in Azure to reduce costs?"],"options":[{"key":"A","text":"Azure Advisor"},{"key":"B","text":"Azure Hybrid Benefit"},{"key":"C","text":"Azure Reservations"},{"key":"D","text":"Azure Spot Virtual Machines"}],"answer":"B","explanation":["Azure Hybrid Benefit applies existing licenses to Azure VMs and SQL services so you don't pay for them again."]},{"id":316,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which workloads are BEST suited for Azure Spot Virtual Machines?"],"options":[{"key":"A","text":"Production databases that must always be available"},{"key":"B","text":"Payment processing systems"},{"key":"C","text":"Domain controllers"},{"key":"D","text":"Interruptible workloads such as batch processing, dev/test and stateless jobs"}],"answer":"D","explanation":["Spot VMs can be evicted at any time when Azure needs the capacity back."]},{"id":317,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which tool do you use to estimate the monthly cost of Azure services you plan to deploy, before deploying them?"],"options":[{"key":"A","text":"Azure Advisor"},{"key":"B","text":"Azure Monitor"},{"key":"C","text":"The Azure pricing calculator"},{"key":"D","text":"Microsoft Cost Management"}],"answer":"C","explanation":["The pricing calculator estimates costs; you don't need an Azure account to use it."]},{"id":318,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which tool helps you compare the cost of running your on-premises infrastructure with the cost of running it in Azure?"],"options":[{"key":"A","text":"The Total Cost of Ownership (TCO) calculator"},{"key":"B","text":"Azure Service Health"},{"key":"C","text":"The pricing calculator"},{"key":"D","text":"Azure Policy"}],"answer":"A","explanation":["The TCO calculator considers servers, databases, storage, networking and labor costs over time."]},{"id":319,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service lets you view and analyze Azure costs, create budgets and set up alerts?"],"options":[{"key":"A","text":"Azure Monitor"},{"key":"B","text":"Azure Policy"},{"key":"C","text":"Azure Advisor"},{"key":"D","text":"Microsoft Cost Management"}],"answer":"D","explanation":["Cost Management includes cost analysis, budgets, alerts and recommendations."]},{"id":320,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO types of alerts are available in Microsoft Cost Management? (Choose two.)"],"options":[{"key":"A","text":"Metric alerts on CPU"},{"key":"B","text":"Service Health alerts"},{"key":"C","text":"Budget alerts"},{"key":"D","text":"Credit alerts"}],"answer":"C, D","explanation":["Cost Management alert types: budget alerts, credit alerts (Enterprise Agreement) and department spending quota alerts."]},{"id":321,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: A budget in Microsoft Cost Management automatically stops your resources when the budget is exceeded.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["No. Budgets send alerts. You can trigger automation (e.g., via action groups), but budgets don't stop resources by themselves."]},{"id":322,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What are resource tags in Azure?"],"options":[{"key":"A","text":"Security labels that encrypt data"},{"key":"B","text":"Name/value pairs of metadata that you apply to resources, resource groups or subscriptions"},{"key":"C","text":"Policies that block deployments"},{"key":"D","text":"Billing accounts"}],"answer":"B","explanation":["Tags help with cost management, operations, security and governance (e.g., Environment=Prod, CostCenter=123)."]},{"id":323,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Tags applied to a resource group are automatically inherited by the resources in that resource group.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["No. Tags are not inherited by default. You can use Azure Policy to inherit or enforce tags."]},{"id":324,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service can you use to enforce that all new resources have a \"CostCenter\" tag?"],"options":[{"key":"A","text":"Resource locks"},{"key":"B","text":"Azure Advisor"},{"key":"C","text":"Microsoft Entra ID"},{"key":"D","text":"Azure Policy"}],"answer":"D","explanation":["Azure Policy can require a tag or append/inherit it automatically."]},{"id":325,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements about Azure tags are true? (Choose two.)"],"options":[{"key":"A","text":"Tags can be added and removed through the portal, CLI, PowerShell and ARM templates"},{"key":"B","text":"A resource can have unlimited tags"},{"key":"C","text":"Tags can be used to group resources for billing reports"},{"key":"D","text":"Every resource type supports tags"}],"answer":"A, C","explanation":["Not all resource types support tags, and a resource can have up to 50 tag name/value pairs."]},{"id":326,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is Azure Policy used for?"],"options":[{"key":"A","text":"Protecting resources from deletion"},{"key":"B","text":"Estimating costs"},{"key":"C","text":"Assigning user permissions to resources"},{"key":"D","text":"Creating, assigning and managing rules that enforce resource properties and evaluate compliance"}],"answer":"D","explanation":["Policy is about WHAT resources can look like; RBAC is about WHO can do what."]},{"id":327,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is a policy initiative in Azure Policy?"],"options":[{"key":"A","text":"A role assignment"},{"key":"B","text":"A resource lock"},{"key":"C","text":"A single policy rule"},{"key":"D","text":"A collection of policy definitions grouped together to achieve a larger goal"}],"answer":"D","explanation":["For example, an initiative can group all policies needed for a regulatory standard."]},{"id":328,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Azure Policy can automatically remediate some non-compliant resources, for example by adding a missing tag.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Some policy effects (like modify or deployIfNotExists) support remediation tasks."]},{"id":329,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Azure Policy evaluates both new and existing resources for compliance.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. New resources are evaluated at deployment and existing ones periodically, and the results appear in the compliance dashboard."]},{"id":330,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO are differences between Azure Policy and Azure RBAC? (Choose two.)"],"options":[{"key":"A","text":"Azure Policy assigns permissions to users"},{"key":"B","text":"RBAC enforces allowed locations"},{"key":"C","text":"Azure RBAC focuses on user actions at different scopes"},{"key":"D","text":"Azure Policy focuses on resource properties during and after deployment"}],"answer":"C, D","explanation":["Policy: \"what can be deployed and how\". RBAC: \"who can perform which actions\"."]},{"id":331,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is the purpose of a resource lock?"],"options":[{"key":"A","text":"To encrypt resources"},{"key":"B","text":"To prevent resources from being accidentally deleted or modified"},{"key":"C","text":"To assign permissions"},{"key":"D","text":"To restrict resources to a region"}],"answer":"B","explanation":["Locks override RBAC permissions: even an Owner can't delete a locked resource without first removing the lock."]},{"id":332,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO types of resource locks are available in Azure? (Choose two.)"],"options":[{"key":"A","text":"WriteOnly"},{"key":"B","text":"NoAccess"},{"key":"C","text":"Delete (CanNotDelete)"},{"key":"D","text":"ReadOnly"}],"answer":"C, D","explanation":["Delete lock: users can read and modify but not delete. ReadOnly: users can read but not modify or delete."]},{"id":333,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A resource has a ReadOnly lock. What can an administrator with the Owner role do with it?"],"options":[{"key":"A","text":"Modify it but not delete it"},{"key":"B","text":"Anything, because Owner overrides locks"},{"key":"C","text":"Read it, but not modify or delete it until the lock is removed"},{"key":"D","text":"Delete it but not modify it"}],"answer":"C","explanation":["Locks apply to all users and roles. Remove the lock first to make changes."]},{"id":334,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: A lock applied to a resource group is inherited by all resources within it.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Locks are inherited from parent scopes (subscription, resource group)."]},{"id":335,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Any user with the Contributor role can remove a resource lock.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["No. Removing locks requires the Microsoft.Authorization/locks/* permissions, granted to Owner and User Access Administrator, not Contributor."]},{"id":336,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is Microsoft Purview?"],"options":[{"key":"A","text":"A firewall service"},{"key":"B","text":"A VM backup service"},{"key":"C","text":"A family of data governance, risk and compliance solutions that gives a unified view of your data across on-premises, multi-cloud and SaaS"},{"key":"D","text":"A pricing tool"}],"answer":"C","explanation":["Purview helps discover, classify, govern and protect data and manage compliance."]},{"id":337,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Where can you find Microsoft's independent audit reports (such as ISO and SOC reports) about its cloud services?"],"options":[{"key":"A","text":"Azure Monitor"},{"key":"B","text":"Microsoft Cost Management"},{"key":"C","text":"Azure Advisor"},{"key":"D","text":"The Service Trust Portal"}],"answer":"D","explanation":["The Service Trust Portal provides audit reports, compliance guides and trust documents."]},{"id":338,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO tools can you use to manage Azure resources from a command line? (Choose two.)"],"options":[{"key":"A","text":"Azure PowerShell"},{"key":"B","text":"Azure pricing calculator"},{"key":"C","text":"Azure CLI"},{"key":"D","text":"Azure Storage Explorer"}],"answer":"A, C","explanation":["Both are cross-platform and also available in Azure Cloud Shell."]},{"id":339,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is Azure Cloud Shell?"],"options":[{"key":"A","text":"A browser-based shell experience for managing Azure resources, providing Bash and PowerShell with tools preinstalled"},{"key":"B","text":"A virtual machine you must deploy"},{"key":"C","text":"A security service"},{"key":"D","text":"A desktop application you must install on Windows"}],"answer":"A","explanation":["Cloud Shell is authenticated automatically with your Azure account and includes Azure CLI and Azure PowerShell."]},{"id":340,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Azure Cloud Shell requires you to install the Azure CLI locally.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["No. Cloud Shell runs in the browser and already includes the tools."]},{"id":341,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements about the Azure portal are true? (Choose two.)"],"options":[{"key":"A","text":"It cannot be used to create resources"},{"key":"B","text":"It is a web-based console for building, managing and monitoring Azure resources"},{"key":"C","text":"It can only be used on Windows computers"},{"key":"D","text":"You can create custom dashboards in it"}],"answer":"B, D","explanation":["The portal is accessible from any modern browser and is designed for resiliency and availability."]},{"id":342,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which management interface is BEST for running repeatable automation scripts on a Windows server already using PowerShell cmdlets?"],"options":[{"key":"A","text":"Azure PowerShell"},{"key":"B","text":"Azure Storage Explorer"},{"key":"C","text":"The Azure portal"},{"key":"D","text":"The Azure mobile app"}],"answer":"A","explanation":["Azure PowerShell provides Az cmdlets for scripting."]},{"id":343,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is Azure Resource Manager (ARM)?"],"options":[{"key":"A","text":"The deployment and management service for Azure that provides a consistent management layer for creating, updating and deleting resources"},{"key":"B","text":"A billing account"},{"key":"C","text":"A monitoring tool"},{"key":"D","text":"An identity service"}],"answer":"A","explanation":["All requests (portal, CLI, PowerShell, REST, SDKs) go through ARM, which authenticates and authorizes them."]},{"id":344,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO are benefits of Azure Resource Manager? (Choose two.)"],"options":[{"key":"A","text":"Provide DDoS protection"},{"key":"B","text":"Replace Microsoft Entra ID"},{"key":"C","text":"Manage infrastructure through declarative templates rather than scripts"},{"key":"D","text":"Deploy, manage and monitor all resources for a solution as a group"}],"answer":"C, D","explanation":["ARM also enables RBAC, tags and locks at different scopes and dependency handling."]},{"id":345,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is infrastructure as code (IaC)?"],"options":[{"key":"A","text":"A pricing model"},{"key":"B","text":"Managing physical infrastructure with robots"},{"key":"C","text":"Managing and provisioning infrastructure through code (templates or scripts) instead of manual processes"},{"key":"D","text":"Writing application code in the cloud"}],"answer":"C","explanation":["IaC makes deployments repeatable, consistent and versionable."]},{"id":346,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO are infrastructure-as-code options native to Azure? (Choose two.)"],"options":[{"key":"A","text":"ARM templates (JSON)"},{"key":"B","text":"Azure Storage Explorer"},{"key":"C","text":"Bicep"},{"key":"D","text":"Azure Advisor"}],"answer":"A, C","explanation":["Bicep is a domain-specific language that compiles to ARM JSON; it's simpler to read and write. (Terraform is a popular third-party option.)"]},{"id":347,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: ARM templates are declarative, meaning you define WHAT you want to deploy and Azure figures out HOW to deploy it.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Templates are also idempotent: deploying the same template many times gives the same result."]},{"id":348,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: ARM templates can deploy resources in parallel when they do not depend on each other.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. ARM orchestrates deployments and handles dependencies automatically."]},{"id":349,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service extends Azure management tools such as Azure Policy and RBAC to servers running in another cloud provider or on-premises?"],"options":[{"key":"A","text":"Azure Migrate"},{"key":"B","text":"Azure ExpressRoute"},{"key":"C","text":"Azure Arc"},{"key":"D","text":"Azure Advisor"}],"answer":"C","explanation":["Azure Arc projects external resources into Azure Resource Manager."]},{"id":350,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO resource types can be managed with Azure Arc? (Choose two.)"],"options":[{"key":"A","text":"Servers (Windows and Linux) running outside Azure"},{"key":"B","text":"Kubernetes clusters running outside Azure"},{"key":"C","text":"Microsoft 365 mailboxes"},{"key":"D","text":"Physical network cables"}],"answer":"A, B","explanation":["Azure Arc also supports Azure data services, SQL Server and VMs on VMware or Azure Local."]},{"id":351,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service analyzes your deployed resources and provides personalized recommendations to improve reliability, security, performance, cost and operational excellence?"],"options":[{"key":"A","text":"Azure Service Health"},{"key":"B","text":"Azure Advisor"},{"key":"C","text":"Azure Policy"},{"key":"D","text":"Azure Monitor"}],"answer":"B","explanation":["Advisor recommendations are available in the portal and through the API, and you can set alerts on them."]},{"id":352,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO are categories of Azure Advisor recommendations? (Choose two.)"],"options":[{"key":"A","text":"Reliability"},{"key":"B","text":"Cost"},{"key":"C","text":"Licensing"},{"key":"D","text":"Marketing"}],"answer":"A, B","explanation":["The five categories: Reliability, Security, Performance, Operational excellence and Cost."]},{"id":353,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Azure Advisor recommends shutting down a VM that has had low CPU usage for 14 days. Which category does this recommendation belong to?"],"options":[{"key":"A","text":"Reliability"},{"key":"B","text":"Security"},{"key":"C","text":"Cost"},{"key":"D","text":"Performance"}],"answer":"C","explanation":["Advisor identifies underutilized resources to reduce spending."]},{"id":354,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which THREE components make up Azure Service Health? (Choose three.)"],"options":[{"key":"A","text":"Azure Policy"},{"key":"B","text":"Azure Advisor"},{"key":"C","text":"Resource Health"},{"key":"D","text":"Azure status"},{"key":"E","text":"Service Health"}],"answer":"C, D, E","explanation":["Azure status = global view of all regions; Service Health = the services and regions you use; Resource Health = your individual resources."]},{"id":355,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which component provides a global view of the health of ALL Azure services across ALL regions?"],"options":[{"key":"A","text":"Service Health"},{"key":"B","text":"Azure status"},{"key":"C","text":"Azure Advisor"},{"key":"D","text":"Resource Health"}],"answer":"B","explanation":["The Azure status page is public and shows broad-impact incidents."]},{"id":356,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["You want to know if a specific virtual machine is unavailable because of an Azure platform problem. Which tool should you use?"],"options":[{"key":"A","text":"Azure Advisor"},{"key":"B","text":"Resource Health"},{"key":"C","text":"Cost Management"},{"key":"D","text":"Azure status"}],"answer":"B","explanation":["Resource Health shows the health of individual resources and past availability."]},{"id":357,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["You want to receive alerts about service issues and planned maintenance that affect the Azure services and regions YOUR subscriptions use. What should you use?"],"options":[{"key":"A","text":"Azure status page"},{"key":"B","text":"Service Health"},{"key":"C","text":"Azure Policy"},{"key":"D","text":"Azure Advisor"}],"answer":"B","explanation":["Service Health is personalized and lets you configure Service Health alerts."]},{"id":358,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is Azure Monitor?"],"options":[{"key":"A","text":"A tool to estimate costs"},{"key":"B","text":"A platform that collects, analyzes and acts on metrics and logs from Azure, on-premises and multi-cloud resources"},{"key":"C","text":"A backup solution"},{"key":"D","text":"A service to assign roles"}],"answer":"B","explanation":["Azure Monitor includes metrics, logs, alerts, Application Insights, Log Analytics, workbooks and more."]},{"id":359,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO types of data does Azure Monitor primarily collect? (Choose two.)"],"options":[{"key":"A","text":"User passwords"},{"key":"B","text":"Invoices"},{"key":"C","text":"Logs"},{"key":"D","text":"Metrics"}],"answer":"C, D","explanation":["Metrics are numeric time series; logs are records with different kinds of data, queried with KQL."]},{"id":360,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure Monitor tool lets you write queries in Kusto Query Language (KQL) against collected log data?"],"options":[{"key":"A","text":"Azure Advisor"},{"key":"B","text":"Azure status"},{"key":"C","text":"Azure Policy"},{"key":"D","text":"Log Analytics"}],"answer":"D","explanation":["Log Analytics is the portal tool for editing and running log queries."]},{"id":361,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure Monitor feature monitors the performance and usage of web applications, including request rates, response times and failure rates?"],"options":[{"key":"A","text":"Azure Advisor"},{"key":"B","text":"Application Insights"},{"key":"C","text":"Log Analytics agent only"},{"key":"D","text":"Azure status"}],"answer":"B","explanation":["Application Insights is an application performance management (APM) feature."]},{"id":362,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO statements about Azure Monitor alerts are true? (Choose two.)"],"options":[{"key":"A","text":"Alerts can trigger action groups to send email/SMS or run automation"},{"key":"B","text":"Alerts cannot be based on log queries"},{"key":"C","text":"Alerts can be based on metrics, logs or the activity log"},{"key":"D","text":"Alerts can only send notifications to Microsoft"}],"answer":"A, C","explanation":["Action groups define notifications and actions such as Logic Apps, Functions or webhooks."]},{"id":363,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which log records subscription-level events such as who created, modified or deleted a resource and when?"],"options":[{"key":"A","text":"The Service Trust Portal"},{"key":"B","text":"Application Insights"},{"key":"C","text":"The Azure activity log"},{"key":"D","text":"Azure Advisor"}],"answer":"C","explanation":["The activity log shows control-plane operations on resources (who, what, when)."]},{"id":364,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service helps you protect against accidental deletion of a production database by an administrator?"],"options":[{"key":"A","text":"Azure Advisor"},{"key":"B","text":"A tag"},{"key":"C","text":"A Delete (CanNotDelete) resource lock"},{"key":"D","text":"A budget"}],"answer":"C","explanation":["Locks prevent deletion even by users with permissions to delete."]},{"id":365,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company wants to make sure that only VMs from an approved list of sizes can be deployed. What should it use?"],"options":[{"key":"A","text":"Azure RBAC"},{"key":"B","text":"Azure Policy (allowed virtual machine SKUs)"},{"key":"C","text":"Tags"},{"key":"D","text":"Resource locks"}],"answer":"B","explanation":["Policy can restrict allowed VM sizes (SKUs)."]},{"id":366,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company wants to ensure that a team can only VIEW resources in a subscription but not change them. What should it assign?"],"options":[{"key":"A","text":"A tag"},{"key":"B","text":"A ReadOnly resource lock"},{"key":"C","text":"An Azure Policy"},{"key":"D","text":"The Reader role using Azure RBAC"}],"answer":"D","explanation":["RBAC controls what a user can do. A ReadOnly lock would block changes for EVERYONE, including admins."]},{"id":367,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: The Azure free account includes a credit to use in the first 30 days, free amounts of popular services for 12 months, and services that are always free.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. That is the structure of the Azure free account."]},{"id":368,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO subscription types or offers are available in Azure? (Choose two.)"],"options":[{"key":"A","text":"Enterprise Agreement"},{"key":"B","text":"Reserved datacenter"},{"key":"C","text":"Pay-as-you-go"},{"key":"D","text":"Perpetual license"}],"answer":"A, C","explanation":["Other offers include free trial, student, Microsoft Customer Agreement and CSP."]},{"id":369,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: The Azure pricing calculator requires you to sign in with an Azure account.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["No. Anyone can use it; signing in only helps save estimates."]},{"id":370,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO items are options you can configure in the pricing calculator? (Choose two.)"],"options":[{"key":"A","text":"Resource locks"},{"key":"B","text":"Pricing tier / VM size"},{"key":"C","text":"Region"},{"key":"D","text":"Number of Microsoft Entra users"}],"answer":"B, C","explanation":["The calculator lets you choose service, region, tier, billing option, support plan and more."]},{"id":371,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: Resources purchased from Azure Marketplace can include costs from the third-party vendor in addition to the Azure infrastructure costs.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Marketplace solutions can include software license fees."]},{"id":372,"domain":"Management & governance","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO actions reduce Azure costs? (Choose two.)"],"options":[{"key":"A","text":"Adding more premium SSD disks"},{"key":"B","
