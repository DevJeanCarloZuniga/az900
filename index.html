const DEFAULT_TEMPLATE = `Soy estudiante preparándome para el examen AZ-900 (Microsoft Azure Fundamentals). Quiero entender esta pregunta de práctica:

{question}

Opciones:
{options}

La respuesta marcada como correcta es: {answer}
{myAnswer}
Explícame:
1. Por qué esa es la respuesta correcta y qué concepto de Azure está evaluando.
2. Por qué cada una de las otras opciones es incorrecta.
3. Un truco o regla para recordarlo el día del examen.

Importante: la pregunta viene de un banco de práctica no oficial. Si crees que la respuesta marcada no es correcta o está desactualizada (por ejemplo, nombres de servicios que cambiaron), dímelo y justifícalo con la documentación de Microsoft Learn.`;

const STORE_KEY = "az900.progress.v2";
const TPL_KEY = "az900.template.v1";

const load = (k, fallback) => { try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

// progress[id] = { sel: ["A"], result: "ok"|"bad"|"seen", flag: bool }
let progress = load(STORE_KEY, {});
let template = load(TPL_KEY, DEFAULT_TEMPLATE);

const $ = (s, el = document) => el.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const answerKeys = q => /^[A-H](\s*,\s*[A-H])*$/.test(q.answer) ? q.answer.split(/\s*,\s*/) : [];
const p = id => (progress[id] ??= {});

function renderCard(q) {
  const keys = answerKeys(q);
  const multi = keys.length > 1;
  const badges = [`<span class="badge">${esc(q.domain)}</span>`];
  if (q.series) badges.push(`<span class="badge" title="Same scenario, different proposed solution">Yes/No series</span>`);
  if (multi) badges.push(`<span class="badge">Pick ${keys.length}</span>`);
  if (q.fixed) badges.push(`<span class="badge warn" title="The PDF had a wrong answer; this one is corrected">Corrected answer</span>`);
  if (q.rebuilt) badges.push(`<span class="badge warn" title="The PDF lost part of this question; it was rebuilt">Rebuilt from PDF</span>`);

  const opts = q.options.length
    ? `<ul class="opts">${q.options.map(o =>
        `<li class="opt${keys.includes(o.key) ? " correct" : ""}" data-key="${o.key}"><span class="k">${o.key}</span><span>${esc(o.text)}</span></li>`
      ).join("")}</ul>${multi ? `<div class="hint">Select ${keys.length} answers.</div>` : ""}`
    : `<p class="hint">No options — think of your answer, then reveal.</p>`;

  const answerText = keys.length
    ? keys.map(k => `${k}. ${esc(q.options.find(o => o.key === k).text)}`).join("<br>")
    : esc(q.answer);

  return `
  <article class="card" id="q${q.id}" data-id="${q.id}">
    <div class="head">
      <span class="num">#${q.id}</span>
      <span class="meta">${esc(q.source)}</span>
      ${badges.join("")}
      <div class="tools">
        <button class="btn icon flag" title="Flag for review">⚑</button>
      </div>
    </div>
    <div class="text">${q.text.map(t => `<p>${esc(t)}</p>`).join("")}</div>
    ${opts}
    <div class="actions">
      <button class="btn primary reveal">Reveal answer</button>
      <button class="btn copy" title="Copy question + answer as an AI study prompt">📋 Copy prompt</button>
    </div>
    <div class="answer">
      <div class="verdict"></div>
      <p><b>Answer:</b><br>${answerText}</p>
      ${q.explanation.map(t => `<p>${esc(t)}</p>`).join("")}
    </div>
  </article>`;
}

const list = $("#list");
list.innerHTML = QUESTIONS.map(renderCard).join("");
const byId = id => QUESTIONS[id - 1];
const cardOf = id => document.getElementById("q" + id);

function paint(id) {
  const q = byId(id), card = cardOf(id), st = progress[id] || {};
  card.querySelectorAll(".opt").forEach(o => o.classList.toggle("sel", (st.sel || []).includes(o.dataset.key)));
  card.querySelector(".flag").classList.toggle("on", !!st.flag);
  const revealed = !!st.result;
  card.classList.toggle("revealed", revealed);
  card.querySelector(".reveal").textContent = revealed ? "Hide answer" : "Reveal answer";
  const v = card.querySelector(".verdict");
  v.className = "verdict" + (st.result === "ok" ? " ok" : st.result === "bad" ? " bad" : "");
  v.textContent = st.result === "ok" ? "✓ Correct" : st.result === "bad" ? "✗ Not quite" : "";
}

function grade(id) {
  const keys = answerKeys(byId(id)), sel = p(id).sel || [];
  if (!keys.length || !sel.length) return "seen";
  return keys.length === sel.length && keys.every(k => sel.includes(k)) ? "ok" : "bad";
}

function updateStats() {
  const vals = Object.values(progress);
  const done = vals.filter(v => v.result).length;
  const graded = vals.filter(v => v.result === "ok" || v.result === "bad");
  const ok = graded.filter(v => v.result === "ok").length;
  const pct = graded.length ? Math.round(ok / graded.length * 100) : 0;
  $("#stats").innerHTML = `<b>${done}</b>/${QUESTIONS.length} done · <b>${ok}</b>/${graded.length} correct (${pct}%)`;
}

function persist(id) { save(STORE_KEY, progress); paint(id); updateStats(); }

// Card interactions (event delegation)
list.addEventListener("click", e => {
  const card = e.target.closest(".card"); if (!card) return;
  const id = +card.dataset.id, q = byId(id), st = p(id);
  setCurrent(id);

  const opt = e.target.closest(".opt");
  if (opt && !st.result) {
    const multi = answerKeys(q).length > 1, k = opt.dataset.key;
    let sel = st.sel || [];
    sel = multi ? (sel.includes(k) ? sel.filter(x => x !== k) : [...sel, k]) : (sel[0] === k ? [] : [k]);
    st.sel = sel; return persist(id);
  }
  if (e.target.closest(".reveal")) {
    if (st.result) { delete st.result; } else { st.result = grade(id); }
    return persist(id);
  }
  if (e.target.closest(".flag")) { st.flag = !st.flag; return persist(id); }
  if (e.target.closest(".copy")) copyPrompt(q);
});

function buildPrompt(q, sel = (progress[q.id] || {}).sel || []) {
  const keys = answerKeys(q);
  const options = q.options.length ? q.options.map(o => `${o.key}. ${o.text}`).join("\n") : "(pregunta sin opciones: ordenar o completar)";
  const answer = keys.length
    ? keys.map(k => `${k}. ${q.options.find(o => o.key === k).text}`).join(" / ")
    : q.answer;
  const myAnswer = sel.length ? `Yo respondí: ${sel.join(", ")}. Si me equivoqué, explícame en qué falló mi razonamiento.\n` : "";
  const vals = {
    question: q.text.join("\n"), options, answer, myAnswer,
    explanation: q.explanation.join("\n"), source: `${q.source} (#${q.id})`,
  };
  return template.replace(/\{(\w+)\}/g, (m, k) => k in vals ? vals[k] : m);
}

async function copyPrompt(q, sel) {
  const text = buildPrompt(q, sel);
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast(`Prompt for #${q.id} copied`);
}

let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

// Navigation
let current = 1;
function setCurrent(id) {
  cardOf(current)?.classList.remove("focus");
  current = id; cardOf(id)?.classList.add("focus");
  $("#jump").value = id;
}
function goTo(id, dir = 0) {
  id = Math.min(Math.max(1, id), QUESTIONS.length);
  const card = cardOf(id);
  if (card.classList.contains("hidden")) { $("#filter").value = "all"; $("#domain").value = ""; applyFilter(false); }
  history.replaceState(null, "", "#q" + id);
  setCurrent(id);
  if (single.matches) {
    card.classList.remove("enter-next", "enter-prev");
    if (dir) { void card.offsetWidth; card.classList.add(dir > 0 ? "enter-next" : "enter-prev"); }
    window.scrollTo({ top: 0 });
  } else {
    card.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}
function visibleIds() { return QUESTIONS.map(q => q.id).filter(id => !cardOf(id).classList.contains("hidden")); }
function step(dir) {
  const ids = visibleIds(); if (!ids.length) return;
  const next = dir > 0 ? ids.find(i => i > current) : [...ids].reverse().find(i => i < current);
  goTo(next ?? (dir > 0 ? ids[0] : ids[ids.length - 1]), dir);
}

// Mobile single-card mode
const single = matchMedia("(max-width: 700px)");
function ensureCurrentVisible() {
  if (!cardOf(current).classList.contains("hidden")) return;
  const ids = visibleIds(); if (ids.length) goTo(ids[0]);
}
function applyMode() {
  document.body.classList.toggle("single", single.matches);
  if (single.matches) ensureCurrentVisible();
}
single.addEventListener("change", applyMode);

// Horizontal swipe: drag the card, release past the threshold to move to the next/previous question
function attachSwipe(el, enabled, getCard, onSwipe) {
  let sx = 0, sy = 0, dx = 0, swiping = null;
  el.addEventListener("touchstart", e => {
    if (!enabled()) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; swiping = null;
  }, { passive: true });
  el.addEventListener("touchmove", e => {
    if (!enabled() || swiping === false) return;
    const x = e.touches[0].clientX - sx, y = e.touches[0].clientY - sy;
    if (swiping === null) {
      if (Math.abs(x) < 10 && Math.abs(y) < 10) return;
      swiping = Math.abs(x) > Math.abs(y);
      if (!swiping) return;
    }
    dx = x;
    const c = getCard();
    c.classList.add("dragging");
    c.style.transform = `translateX(${dx}px) rotate(${dx / 40}deg)`;
    c.style.opacity = 1 - Math.min(Math.abs(dx) / 600, 0.4);
  }, { passive: true });
  const end = () => {
    if (!swiping) return;
    const c = getCard();
    c.classList.remove("dragging"); c.style.transform = ""; c.style.opacity = "";
    if (Math.abs(dx) > 70) onSwipe(dx < 0 ? 1 : -1);
    swiping = null;
  };
  el.addEventListener("touchend", end);
  el.addEventListener("touchcancel", end);
}
attachSwipe(list, () => single.matches, () => cardOf(current), step);

$("#jumpForm").addEventListener("submit", e => { e.preventDefault(); const n = +$("#jump").value; if (n) goTo(n); $("#jump").select(); });
$("#prev").onclick = () => step(-1);
$("#next").onclick = () => step(1);
$("#shuffle").onclick = () => {
  const pool = QUESTIONS.filter(q => !(progress[q.id] || {}).result).map(q => q.id);
  if (!pool.length) return toast("All questions done 🎉");
  goTo(pool[Math.floor(Math.random() * pool.length)]);
};

function applyFilter(scroll = true) {
  const f = $("#filter").value, d = $("#domain").value;
  QUESTIONS.forEach(q => {
    const st = progress[q.id] || {};
    const show = (f === "all" || (f === "unanswered" && !st.result) || (f === "wrong" && st.result === "bad")
      || (f === "flagged" && st.flag) || (f === "fixed" && (q.fixed || q.rebuilt))) && (!d || q.domain === d);
    cardOf(q.id).classList.toggle("hidden", !show);
  });
  $("#empty").hidden = visibleIds().length > 0;
  if (single.matches) ensureCurrentVisible();
  if (scroll) window.scrollTo({ top: 0 });
}
$("#filter").onchange = $("#domain").onchange = () => {
  try { localStorage.setItem("az900.filter", JSON.stringify([$("#filter").value, $("#domain").value])); } catch {}
  applyFilter();
};

// Keyboard: "/" or "g" focuses the jump box, arrows move between questions
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea, select")) { if (e.key === "Escape") e.target.blur(); return; }
  if (!$("#exam").hidden) {
    if (!exam || exam.done) return;
    if (e.key === "ArrowRight") examNav(1);
    else if (e.key === "ArrowLeft") examNav(-1);
    else if (/^[a-h]$/.test(e.key)) $(`#exBody .opt[data-key="${e.key.toUpperCase()}"]`)?.click();
    return;
  }
  if (e.key === "/" || e.key === "g") { e.preventDefault(); $("#jump").focus(); $("#jump").select(); }
  else if (e.key === "ArrowRight" || e.key === "j") step(1);
  else if (e.key === "ArrowLeft" || e.key === "k") step(-1);
  else if (e.key === "r") cardOf(current).querySelector(".reveal").click();
  else if (e.key === "c") copyPrompt(byId(current));
  else if (/^[a-h]$/.test(e.key)) cardOf(current).querySelector(`.opt[data-key="${e.key.toUpperCase()}"]`)?.click();
});

// Settings dialog
const dlg = $("#dlg");
$("#settings").onclick = () => { $("#tpl").value = template; dlg.showModal(); };
$("#tplCancel").onclick = () => dlg.close();
$("#tplDefault").onclick = () => { $("#tpl").value = DEFAULT_TEMPLATE; };
$("#tplSave").onclick = () => { template = $("#tpl").value; save(TPL_KEY, template); dlg.close(); toast("Template saved"); };
// Wipes everything this app saved in the browser: answers, flags, filters and the custom prompt template
function clearStorage() {
  if (!confirm("Clear all saved data (answers, flags, filters and prompt template)?")) return;
  try { Object.keys(localStorage).filter(k => k.startsWith("az900.")).forEach(k => localStorage.removeItem(k)); } catch {}
  progress = {}; template = DEFAULT_TEMPLATE; exam = null; closeExam();
  $("#filter").value = "all"; $("#domain").value = "";
  QUESTIONS.forEach(q => paint(q.id)); updateStats(); applyFilter(false);
  if (dlg.open) dlg.close();
  goTo(1); toast("Storage cleared");
}
$("#resetProgress").onclick = clearStorage;
$("#clear").onclick = clearStorage;

// ---- Exam simulation ----
const EXAM_KEY = "az900.exam.v1", HIST_KEY = "az900.examHistory.v1";
const EXAM_MINUTES = 45, PASS_SCORE = 70;
// 45 questions split roughly by the official domain weights (25–30% / 35–40% / 30–35%)
const EXAM_MIX = { "Cloud concepts": 12, "Architecture & services": 17, "Management & governance": 16 };
// Score bands (minimum score → phrases); one phrase is picked at random
const VERDICTS = [
  [95, ["¡Epa, estás volando! 🚀🔥", "¡Diay mae, qué nivel! Andá agendá ese examen ya 🏆", "¡Qué tuanis! Eso está para sacarlo con los ojos cerrados 😎"]],
  [85, ["¡Pura vida, mae! Eso está demasiado bueno 🤙😎", "¡Qué chiva! Ya casi estás listo 🙌", "¡Upe, qué nota! Así sí da gusto 💪🔥"]],
  [70, ["Diay, aprobado… pero no te confiés, mae 😬", "Pasó raspando, pero pasó 😅 Una repasadita más y queda pura vida 🤙", "Ahí vamos, mae. Aprobado, pero hay que pulirlo 🛠️"]],
  [55, ["Diay mae, casi casi… pero todavía está muy verde 🥑", "Está jalado, pero se puede. ¡A meterle más! 💪📚", "Uy, por poquito. Una semanita más de repaso y sale 🐢➡️🐇"]],
  [40, ["Uy mae… para algo así mejor no ir al examen 🙈", "Diay, ¿y eso? Todavía falta bastante, mae 🫠", "Mejor guardemos la plata del examen un ratito más 💸🙈"]],
  [0, ["¡Qué sal, mae! 🧂😭 A darle al repaso desde cero", "Upe… ¿hay alguien estudiando aquí? 😂📚", "Mae, esto está para llorar en el bus 🚌😭 ¡Pero de aquí solo se sube!"]],
];
let exam = load(EXAM_KEY, null), examTimer = null;

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const examSel = id => exam.sel[id] || [];
const isRight = id => sameSet(examSel(id), answerKeys(byId(id)));
const saveExam = () => save(EXAM_KEY, exam);

function startExam() {
  const ids = Object.entries(EXAM_MIX).flatMap(([d, n]) =>
    shuffle(QUESTIONS.filter(q => q.domain === d && answerKeys(q).length).map(q => q.id)).slice(0, n));
  exam = { ids: shuffle(ids), sel: {}, idx: 0, startedAt: Date.now(), endsAt: Date.now() + EXAM_MINUTES * 60000, done: false };
  saveExam(); openExam();
}
function openExam() {
  $("#exam").hidden = false; document.body.style.overflow = "hidden";
  $("#exFinish").hidden = false; $("#exQuit").textContent = "Quit";
  renderExamQ(0); tick();
  clearInterval(examTimer); examTimer = setInterval(tick, 1000);
}
function closeExam() {
  $("#exam").hidden = true; document.body.style.overflow = ""; clearInterval(examTimer);
}
function tick() {
  const left = Math.max(0, exam.endsAt - Date.now());
  const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
  $("#exTimer").textContent = `${m}:${String(s).padStart(2, "0")}`;
  $("#exTimer").classList.toggle("low", left < 5 * 60000);
  if (!left) finishExam(true);
}

function renderExamQ(dir) {
  const q = byId(exam.ids[exam.idx]), sel = examSel(q.id), keys = answerKeys(q), last = exam.idx === exam.ids.length - 1;
  $("#exCount").textContent = `${exam.idx + 1} / ${exam.ids.length}`;
  $("#exBody").innerHTML = `
    <article class="card exam-q${dir > 0 ? " enter-next" : dir < 0 ? " enter-prev" : ""}">
      <div class="head"><span class="num">#${exam.idx + 1}</span>${keys.length > 1 ? `<span class="badge">Pick ${keys.length}</span>` : ""}</div>
      <div class="text">${q.text.map(t => `<p>${esc(t)}</p>`).join("")}</div>
      <ul class="opts">${q.options.map(o =>
        `<li class="opt${sel.includes(o.key) ? " sel" : ""}" data-key="${o.key}"><span class="k">${o.key}</span><span>${esc(o.text)}</span></li>`).join("")}</ul>
      ${keys.length > 1 ? `<div class="hint">Select ${keys.length} answers.</div>` : ""}
      <div class="actions">
        <button class="btn" data-nav="-1"${exam.idx ? "" : " disabled"}>‹ Previous</button>
        <button class="btn primary" data-nav="1">${last ? "Finish exam" : "Next ›"}</button>
      </div>
    </article>
    <div class="qmap">${exam.ids.map((id, i) =>
      `<button data-go="${i}" class="${examSel(id).length ? "answered" : ""}${i === exam.idx ? " cur" : ""}">${i + 1}</button>`).join("")}</div>`;
  if (dir) $("#exam").scrollTo({ top: 0 });
}
function examNav(dir) {
  const i = exam.idx + dir;
  if (i >= exam.ids.length) return askFinish();
  if (i < 0) return;
  exam.idx = i; saveExam(); renderExamQ(dir);
}
function askFinish() {
  const blank = exam.ids.filter(id => !examSel(id).length).length;
  if (confirm(blank ? `You have ${blank} unanswered question(s). Finish anyway?` : "Finish the exam and see your score?")) finishExam(false);
}
function finishExam(timeUp) {
  clearInterval(examTimer);
  if (exam.done) return;
  exam.done = true; exam.finishedAt = Math.min(Date.now(), exam.endsAt);
  exam.correct = exam.ids.filter(isRight).length;
  exam.score = Math.round(exam.correct / exam.ids.length * 100);
  const hist = load(HIST_KEY, []);
  hist.unshift({ at: exam.finishedAt, score: exam.score });
  save(HIST_KEY, hist.slice(0, 20));
  save(EXAM_KEY, null);  // a finished exam isn't resumed on reload
  renderResults(timeUp);
}

function renderResults(timeUp) {
  const { score, correct, ids } = exam, pass = score >= PASS_SCORE;
  const phrases = VERDICTS.find(([min]) => score >= min)[1];
  const phrase = phrases[Math.floor(Math.random() * phrases.length)];
  const mins = Math.max(1, Math.round((exam.finishedAt - exam.startedAt) / 60000));
  const domains = Object.keys(EXAM_MIX).map(d => {
    const dIds = ids.filter(id => byId(id).domain === d);
    return `<li>${esc(d)}: <b>${dIds.filter(isRight).length}/${dIds.length}</b></li>`;
  }).join("");
  const prev = load(HIST_KEY, []).slice(1, 6).map(h => h.score);
  $("#exTimer").textContent = ""; $("#exCount").textContent = "Results";
  $("#exFinish").hidden = true; $("#exQuit").textContent = "Close";
  $("#exBody").innerHTML = `
    <section class="card score">
      ${timeUp ? `<p class="hint">⏰ Time's up!</p>` : ""}
      <div class="big ${pass ? "pass" : "fail"}">${score}<small>/100</small></div>
      <div>${correct} of ${ids.length} correct · ${mins} min · ${pass ? "Pass" : "Fail"} (passing ≈ ${PASS_SCORE})</div>
      <div class="phrase">${phrase}</div>
      <ul>${domains}</ul>
      ${prev.length ? `<p class="hint">Previous attempts: ${prev.join(" · ")}</p>` : ""}
      <div class="actions"><button class="btn primary" id="exAgain">New exam</button></div>
    </section>
    <div class="review-head">
      <h3 style="margin:0">Review</h3>
      <label class="hint"><input type="checkbox" id="onlyWrong"> Only wrong / unanswered</label>
    </div>
    <div id="review">${ids.map(reviewCard).join("")}</div>`;
  $("#exam").scrollTo({ top: 0 });
}
function reviewCard(id, i) {
  const q = byId(id), sel = examSel(id), keys = answerKeys(q), ok = isRight(id);
  return `
    <article class="card revealed review ${ok ? "is-ok" : "is-bad"}">
      <div class="head">
        <span class="num">#${i + 1}</span>
        <span class="badge${ok ? "" : " warn"}">${ok ? "✓ Correct" : sel.length ? "✗ Wrong" : "— Unanswered"}</span>
        <span class="meta">${esc(q.domain)} · bank <a href="#q${id}" data-open="${id}">#${id}</a></span>
      </div>
      <div class="text">${q.text.map(t => `<p>${esc(t)}</p>`).join("")}</div>
      <ul class="opts">${q.options.map(o =>
        `<li class="opt${keys.includes(o.key) ? " correct" : ""}${sel.includes(o.key) ? " sel" : ""}"><span class="k">${o.key}</span><span>${esc(o.text)}</span></li>`).join("")}</ul>
      <div class="answer">
        <p><b>Your answer:</b> ${sel.join(", ") || "—"} · <b>Correct:</b> ${keys.join(", ")}</p>
        ${q.explanation.map(t => `<p>${esc(t)}</p>`).join("")}
      </div>
      <div class="actions"><button class="btn" data-copy="${id}">📋 Copy prompt</button></div>
    </article>`;
}

$("#exBody").addEventListener("click", e => {
  const t = e.target;
  if (t.closest("#exAgain")) return startExam();
  if (t.closest("[data-copy]")) { const id = +t.closest("[data-copy]").dataset.copy; return copyPrompt(byId(id), examSel(id)); }
  if (t.closest("[data-open]")) { e.preventDefault(); closeExam(); return goTo(+t.closest("[data-open]").dataset.open); }
  if (exam.done) return;
  const opt = t.closest(".opt");
  if (opt) {
    const q = byId(exam.ids[exam.idx]), k = opt.dataset.key, sel = examSel(q.id);
    exam.sel[q.id] = answerKeys(q).length > 1
      ? (sel.includes(k) ? sel.filter(x => x !== k) : [...sel, k])
      : (sel[0] === k ? [] : [k]);
    saveExam(); return renderExamQ(0);
  }
  if (t.closest("[data-nav]")) return examNav(+t.closest("[data-nav]").dataset.nav);
  if (t.closest("[data-go]")) { exam.idx = +t.closest("[data-go]").dataset.go; saveExam(); renderExamQ(0); }
});
$("#exBody").addEventListener("change", e => {
  if (e.target.id === "onlyWrong") $("#review").classList.toggle("only-wrong", e.target.checked);
});
attachSwipe($("#exBody"), () => !$("#exam").hidden && exam && !exam.done, () => $("#exBody .exam-q"), examNav);

$("#startExam").onclick = () => {
  if (exam && !exam.done) return openExam();  // resume an exam in progress
  startExam();
};
$("#exFinish").onclick = askFinish;
$("#exQuit").onclick = () => {
  if (exam && !exam.done) {
    if (!confirm("Quit this exam? Your answers will be lost.")) return;
    save(EXAM_KEY, null);
  }
  exam = null; closeExam();
};

// Init
try { const [f, d] = JSON.parse(localStorage.getItem("az900.filter")) || []; $("#filter").value = f || "all"; $("#domain").value = d || ""; } catch {}
QUESTIONS.forEach(q => paint(q.id));
updateStats(); applyFilter(false); applyMode();
$("#jump").max = QUESTIONS.length;
const fromHash = +(location.hash.match(/^#q(\d+)$/) || [])[1];
if (fromHash) goTo(fromHash); else setCurrent(1);
// The browser's own #anchor jump runs after this script; in single-card mode undo it
addEventListener("load", () => { if (single.matches) window.scrollTo({ top: 0 }); });
if (exam && !exam.done) openExam();  // resume an unfinished exam after a reload
</script>
</body>
</html>
