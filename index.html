<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZ-900 Practice</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5f6b7d; --border: #dde2ea;
    --accent: #0067b8; --accent-soft: #e6f0fa;
    --ok: #127a3c; --ok-soft: #e3f5ea; --bad: #b42318; --bad-soft: #fdeceb;
    --warn: #8a5a00; --warn-soft: #fff4d6; --flag: #c27c00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2028; --text: #e6e9ef; --muted: #98a2b3; --border: #2d3440;
      --accent: #4ea1ff; --accent-soft: #1d2b3d;
      --ok: #4cc27a; --ok-soft: #173023; --bad: #ff7b6e; --bad-soft: #3a1d1b;
      --warn: #f0c060; --warn-soft: #3a3018; --flag: #f0b040;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* Sticky toolbar */
  .bar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
  .bar-inner { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap;
    gap: 8px; align-items: center; }
  .jump { display: flex; align-items: center; gap: 6px; }
  .jump input { width: 84px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); font-weight: 600; }
  .bar select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  .stats { margin-left: auto; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .stats b { color: var(--text); }
  .stats .clear { margin-left: 6px; padding: 2px 8px; font-size: 13px; color: var(--bad); }
  .stats .clear:hover { border-color: var(--bad); }

  .btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card);
    cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.icon { padding: 6px 10px; }

  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 60vh; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px;
    margin-bottom: 16px; scroll-margin-top: 70px; }
  .card.hidden { display: none; }
  .card:target, .card.focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .num { font-size: 20px; font-weight: 700; }
  .meta { font-size: 13px; color: var(--muted); }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge a { color: inherit; }
  .head .tools { margin-left: auto; display: flex; gap: 6px; }
  .flag.on { color: var(--flag); border-color: var(--flag); }

  .text p { margin: 0 0 8px; }
  .text code { font-size: 14px; }
  .opts { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 8px; }
  .opt { display: flex; gap: 10px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; user-select: none; }
  .opt:hover { border-color: var(--accent); }
  .opt .k { font-weight: 700; min-width: 1.2em; }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .revealed .opt { cursor: default; }
  .revealed .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .revealed .opt.sel:not(.correct) { border-color: var(--bad); background: var(--bad-soft); }
  .hint { font-size: 13px; color: var(--muted); }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .answer { display: none; margin-top: 14px; padding: 12px 14px; border-radius: 8px; background: var(--ok-soft);
    border-left: 4px solid var(--ok); }
  .revealed .answer { display: block; }
  .answer .verdict { font-weight: 700; margin-bottom: 4px; }
  .answer .verdict.bad { color: var(--bad); }
  .answer .verdict.ok { color: var(--ok); }
  .answer p { margin: 6px 0; }
  .answer a { color: var(--accent); word-break: break-all; font-size: 14px; }
  .answer .warn { color: var(--warn); font-size: 14px; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text);
    color: var(--bg); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text);
    width: min(720px, calc(100vw - 32px)); }
  dialog textarea { width: 100%; min-height: 260px; padding: 10px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); font: 14px/1.5 ui-monospace, Consolas, monospace; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; }
  .kbd { font-size: 12px; color: var(--muted); }

  /* Mobile: one question at a time, swipe between cards */
  body.single main { padding-bottom: 24px; overflow-x: hidden; }
  body.single #list .card:not(.focus) { display: none; }
  body.single #list .card.focus, .exam-q { outline: none; touch-action: pan-y; transition: transform .2s ease, opacity .2s ease; }
  .card.dragging { transition: none !important; }
  body.single .swipe-hint { display: block; }
  .swipe-hint { display: none; text-align: center; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .card.enter-next { animation: in-from-right .22s ease-out; }
  .card.enter-prev { animation: in-from-left .22s ease-out; }
  @keyframes in-from-right { from { transform: translateX(40%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes in-from-left { from { transform: translateX(-40%); opacity: 0; } to { transform: none; opacity: 1; } }
  #empty { text-align: center; }

  /* Exam simulation overlay */
  #exam { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; overflow-x: hidden; }
  #exam[hidden] { display: none; }
  .exam-bar { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--border); }
  .exam-bar .bar-inner { flex-wrap: nowrap; }
  .timer { font: 700 20px/1 ui-monospace, Consolas, monospace; }
  .timer.low { color: var(--bad); }
  #exCount { color: var(--muted); font-size: 14px; }
  .exam-bar .grow { flex: 1; }
  .exam-body { max-width: 860px; margin: 0 auto; padding: 16px 16px 40px; }
  .qmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin-top: 8px; }
  .qmap button { padding: 6px 0; border: 1px solid var(--border); border-radius: 6px; background: var(--card); cursor: pointer; font-size: 13px; }
  .qmap .answered { background: var(--accent-soft); border-color: var(--accent); }
  .qmap .cur { outline: 2px solid var(--accent); }
  .score { text-align: center; }
  .score .big { font-size: 72px; font-weight: 800; line-height: 1; margin: 8px 0; }
  .score .big small { font-size: 24px; color: var(--muted); font-weight: 600; }
  .score .pass { color: var(--ok); }
  .score .fail { color: var(--bad); }
  .score .phrase { font-size: 22px; font-weight: 600; margin: 14px 0; }
  .score ul { list-style: none; padding: 0; margin: 12px 0; color: var(--muted); }
  .score .actions { justify-content: center; }
  .review-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin: 20px 0 10px; }
  #review.only-wrong .is-ok { display: none; }
  .review .answer p:first-child { margin-top: 0; }

  @media (max-width: 600px) {
    .bar-inner { gap: 6px; padding: 8px 12px; }
    .bar .btn.icon { padding: 6px 9px; }
    .bar select { flex: 1 1 140px; min-width: 0; }
    .jump input { width: 60px; }
    .stats { font-size: 13px; }
    body.single .card { scroll-margin-top: 140px; }
    .stats { margin-left: 0; width: 100%; }
    .card { padding: 14px; }
  }
</style>
</head>
<body>
<div class="bar">
  <div class="bar-inner">
    <form class="jump" id="jumpForm">
      <label for="jump">#</label>
      <input id="jump" type="number" min="1" inputmode="numeric" placeholder="Go to" autocomplete="off">
      <button class="btn primary" type="submit">Go</button>
    </form>
    <button class="btn icon" id="prev" title="Previous (←)">‹</button>
    <button class="btn icon" id="next" title="Next (→)">›</button>
    <button class="btn icon" id="shuffle" title="Jump to a random unanswered question">🎲</button>
    <button class="btn icon" id="settings" title="Edit prompt template / reset">⚙</button>
    <button class="btn icon" id="startExam" title="Exam simulation: 45 questions, 45 minutes">⏱</button>
    <select id="filter" title="Filter">
      <option value="all">All questions</option>
      <option value="unanswered">Unanswered</option>
      <option value="wrong">Got wrong</option>
      <option value="flagged">Flagged</option>
      <option value="fixed">Corrected / rebuilt from PDF</option>
    </select>
    <select id="domain" title="Exam domain">
      <option value="">All domains</option>
      <option>Cloud concepts</option>
      <option>Architecture & services</option>
      <option>Management & governance</option>
    </select>
    <div class="stats"><span id="stats"></span> <button class="btn clear" id="clear" title="Clear all saved answers, flags and filters">🗑 Reset</button></div>
  </div>
</div>

<main><div id="list"></div><p id="empty" class="hint" hidden>No questions match this filter.</p><p class="swipe-hint">Swipe ← → to change question</p></main>
<section id="exam" hidden>
  <div class="exam-bar">
    <div class="bar-inner">
      <span class="timer" id="exTimer"></span>
      <span id="exCount"></span>
      <span class="grow"></span>
      <button class="btn" id="exQuit">Quit</button>
      <button class="btn primary" id="exFinish">Finish</button>
    </div>
  </div>
  <div class="exam-body" id="exBody"></div>
</section>
<div class="toast" id="toast"></div>

<dialog id="dlg">
  <h3 style="margin-top:0">Prompt template</h3>
  <p class="kbd">Placeholders: {question} {options} {answer} {explanation} {myAnswer} {source}</p>
  <textarea id="tpl"></textarea>
  <div class="row">
    <button class="btn" id="resetProgress" style="margin-right:auto">Clear all saved data</button>
    <button class="btn" id="tplDefault">Restore default</button>
    <button class="btn" id="tplCancel">Cancel</button>
    <button class="btn primary" id="tplSave">Save</button>
  </div>
</dialog>

<script>
const QUESTIONS = [{"id":1,"domain":"Cloud concepts","source":"PDF · Holden Q1","series":false,"fixed":false,"rebuilt":false,"text":["You have 50 virtual machines hosted on-premises and 50 virtual machines hosted in Azure. The on-premises virtual machines and the Azure virtual machines connect to each other.","Which type of cloud model is this?"],"options":[{"key":"A","text":"public"},{"key":"B","text":"private"},{"key":"C","text":"hybrid"}],"answer":"C","explanation":["A hybrid cloud combines on-premises (private) infrastructure with public cloud resources that are connected and work together."]},{"id":2,"domain":"Management & governance","source":"PDF · Holden Q2","series":true,"fixed":false,"rebuilt":false,"text":["Your company has an Azure subscription that contains the following unused resources:","* 20 user accounts in Microsoft Entra ID","* Five groups in Microsoft Entra ID","* 10 public IP addresses","* 10 network interfaces","You need to reduce the Azure costs for the company.","Solution: You remove the unused public IP addresses.","Does this meet the goal?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Public IP addresses are billed even when unused. Entra users/groups and network interfaces have no cost by themselves."]},{"id":3,"domain":"Architecture & services","source":"PDF · Holden Q3","series":true,"fixed":false,"rebuilt":false,"text":["Your Azure environment contains multiple Azure virtual machines. You need to ensure that a virtual machine named VM1 is accessible from the Internet over HTTP.","Solution: You modify an Azure Traffic Manager profile.","Does this meet the goal?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["Traffic Manager is DNS-based traffic routing between endpoints; it does not open ports. To allow HTTP you add an inbound rule for port 80 in the network security group (NSG) associated with VM1."]},{"id":4,"domain":"Management & governance","source":"PDF · Holden Q4","series":false,"fixed":true,"rebuilt":false,"text":["You need to purchase a third-party virtual security appliance that you will deploy to an Azure subscription. What should you use?"],"options":[{"key":"A","text":"Azure Marketplace"},{"key":"B","text":"Microsoft Defender for Cloud"},{"key":"C","text":"Azure subscriptions"},{"key":"D","text":"Microsoft Store"}],"answer":"A","explanation":["CORRECTED (the PDF said Security Center). Azure Marketplace is the catalog of third-party and Microsoft solutions (including virtual appliances such as firewalls) that you deploy into your subscription. Defender for Cloud is a security posture/threat protection service, not a store."]},{"id":5,"domain":"Management & governance","source":"PDF · Holden Q5","series":true,"fixed":true,"rebuilt":false,"text":["You have an Azure subscription named Subscription1. You sign in to the Azure portal and create a resource group named RG1.","From Azure documentation, you have the following command that creates a virtual machine named VM1.","az vm create --resource-group RG1 --name VM1 --image UbuntuLTS --generate-ssh-keys","You need to create VM1 in Subscription1 by using the command.","Solution: From the Azure portal, launch Azure Cloud Shell and select Bash. Run the command in Cloud Shell.","Does this meet the goal?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["CORRECTED (the PDF said No). \"az\" is the Azure CLI, which is preinstalled in Cloud Shell (both Bash and PowerShell experiences) and is already authenticated with your account, so the command runs."]},{"id":6,"domain":"Architecture & services","source":"PDF · Holden Q6","series":false,"fixed":false,"rebuilt":true,"text":["Azure distributed denial of service (DDoS) protection is an example of protection that is implemented at which layer of the defense-in-depth model?"],"options":[{"key":"A","text":"application"},{"key":"B","text":"network"},{"key":"C","text":"perimeter"},{"key":"D","text":"data"}],"answer":"C","explanation":["REBUILT (the PDF lost the options). In Microsoft's defense-in-depth model the perimeter layer protects against network-based attacks on your resources, and DDoS protection is the classic example. The network layer is about limiting communication between resources (segmentation, NSGs)."]},{"id":7,"domain":"Management & governance","source":"PDF · Holden Q7","series":false,"fixed":false,"rebuilt":false,"text":["This question requires that you evaluate the underlined text to determine if it is correct.","When planning to migrate a public website to Azure, you must plan to pay monthly usage costs.","Review the underlined text (\"pay monthly usage costs\"). If it makes the statement correct, select \"No change is needed\". Otherwise, select the answer choice that makes the statement correct."],"options":[{"key":"A","text":"No change is needed"},{"key":"B","text":"deploy a VPN"},{"key":"C","text":"pay to transfer all the website data to Azure"},{"key":"D","text":"reduce the number of connections to the website"}],"answer":"A","explanation":["Azure uses a consumption-based (pay-as-you-go) model billed monthly. Inbound data transfer (uploading data to Azure) is free, so you don't pay to move the website data in; outbound traffic is what gets charged."]},{"id":8,"domain":"Cloud concepts","source":"PDF · Holden Q8","series":false,"fixed":false,"rebuilt":false,"text":["You need to identify a customer's level of shared responsibility based on the cloud service model.","Arrange the models from MOST customer responsibility to LEAST customer responsibility."],"options":[],"answer":"Infrastructure as a service (IaaS) → Platform as a service (PaaS) → Software as a service (SaaS)","explanation":["With IaaS the customer manages OS, middleware, apps and data. With PaaS the provider also manages the OS and runtime. With SaaS the provider manages almost everything; the customer keeps responsibility for data, devices, accounts and identities."]},{"id":9,"domain":"Architecture & services","source":"PDF · Leon Q1","series":false,"fixed":false,"rebuilt":false,"text":["How many copies of data are maintained by an Azure Storage account that uses geo-redundant storage (GRS)?"],"options":[{"key":"A","text":"3"},{"key":"B","text":"4"},{"key":"C","text":"6"},{"key":"D","text":"9"}],"answer":"C","explanation":["GRS keeps 3 copies in the primary region (LRS) and asynchronously replicates to the secondary (paired) region, where it keeps 3 more copies: 6 in total."]},{"id":10,"domain":"Management & governance","source":"PDF · Leon Q2","series":false,"fixed":false,"rebuilt":false,"text":["Your company has an Azure subscription that contains the following unused resources: 20 Microsoft Entra user accounts, five Microsoft Entra groups, 10 public IP addresses and 10 network interfaces.","You need to reduce the Azure costs for the company. Which unused resources should you remove?"],"options":[{"key":"A","text":"the public IP addresses"},{"key":"B","text":"the groups"},{"key":"C","text":"the network interfaces"},{"key":"D","text":"the user accounts"}],"answer":"A","explanation":["Public IP addresses have a cost even when they are not associated with anything. Network interfaces, users and groups are free."]},{"id":11,"domain":"Architecture & services","source":"PDF · Leon Q3","series":false,"fixed":false,"rebuilt":false,"text":["You have an on-premises application that sends email notifications automatically based on a rule. You plan to migrate the application to Azure. You need to recommend a serverless computing solution for the application.","What should you include in the recommendation?"],"options":[{"key":"A","text":"a web app"},{"key":"B","text":"an API app"},{"key":"C","text":"a logic app"},{"key":"D","text":"a server image in Azure Marketplace"}],"answer":"C","explanation":["Azure Logic Apps is a serverless workflow service with built-in connectors (e.g., Outlook/Office 365) to run rule-based automations such as sending emails. Web apps and API apps run on an App Service plan (you pay for allocated instances)."]},{"id":12,"domain":"Architecture & services","source":"PDF · Leon Q4","series":false,"fixed":false,"rebuilt":false,"text":["Your company plans to deploy several million sensors that will upload data to Azure. You need to identify which Azure resources must be created to support the planned solution.","Which two Azure resources should you identify? (Choose two.)"],"options":[{"key":"A","text":"Azure Queue storage"},{"key":"B","text":"Azure Files"},{"key":"C","text":"Azure Data Lake Storage"},{"key":"D","text":"Azure Notification Hubs"},{"key":"E","text":"Azure IoT Hub"}],"answer":"C, E","explanation":["IoT Hub securely ingests telemetry from millions of devices, and the data must be stored somewhere scalable for analytics, such as Azure Data Lake Storage. Notification Hubs sends push notifications TO mobile apps, the opposite direction."]},{"id":13,"domain":"Architecture & services","source":"PDF · Leon Q5","series":false,"fixed":false,"rebuilt":false,"text":["You plan to deploy a website to Azure. The website will be accessed by users worldwide and will host large video files. You need to recommend which Azure feature must be used to provide the best video playback experience.","What should you recommend?"],"options":[{"key":"A","text":"an application gateway"},{"key":"B","text":"an Azure ExpressRoute circuit"},{"key":"C","text":"a content delivery network (CDN)"},{"key":"D","text":"an Azure Traffic Manager profile"}],"answer":"C","explanation":["A CDN caches static content such as video files at edge locations close to users worldwide, reducing latency."]},{"id":14,"domain":"Management & governance","source":"PDF · Leon Q6","series":true,"fixed":false,"rebuilt":false,"text":["You have an Azure subscription named Subscription1 and a resource group named RG1.","From Azure documentation, you have the following command that creates a virtual machine named VM1.","az vm create --resource-group RG1 --name VM1 --image UbuntuLTS --generate-ssh-keys","You need to create VM1 in Subscription1 by using the command.","Solution: From the Azure portal, launch Azure Cloud Shell and select PowerShell. Run the command in Cloud Shell.","Does this meet the goal?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["The Azure CLI (\"az\") is also available inside the PowerShell experience of Cloud Shell, so the command runs."]},{"id":15,"domain":"Management & governance","source":"PDF · Leon Q8","series":true,"fixed":true,"rebuilt":false,"text":["You have an Azure subscription named Subscription1 and a resource group named RG1.","From Azure documentation, you have the following command that creates a virtual machine named VM1.","az vm create --resource-group RG1 --name VM1 --image UbuntuLTS --generate-ssh-keys","You need to create VM1 in Subscription1 by using the command.","Solution: From a computer that runs Windows 10, install Azure CLI. From a command prompt, sign in to Azure and then run the command.","Does this meet the goal?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["CORRECTED (the PDF said No). The Azure CLI is cross-platform (Windows, macOS, Linux). After installing it and running \"az login\", the command works from cmd or PowerShell."]},{"id":16,"domain":"Architecture & services","source":"PDF · Leon Q10","series":false,"fixed":true,"rebuilt":false,"text":["This question requires that you evaluate the underlined text to determine if it is correct.","Data that is stored in the Archive access tier of an Azure Storage account can be accessed at any time by using azcopy.exe.","Review the underlined text (\"can be accessed at any time by using azcopy.exe\"). If it makes the statement correct, select \"No change is needed\". Otherwise, select the answer choice that makes the statement correct."],"options":[{"key":"A","text":"No change is needed."},{"key":"B","text":"can only be read by using Azure Backup"},{"key":"C","text":"must be restored before the data can be accessed"},{"key":"D","text":"must be rehydrated before the data can be accessed"}],"answer":"D","explanation":["CORRECTED (the PDF said No change). The Archive tier is offline. A blob must be rehydrated to the Hot, Cool or Cold tier (can take hours) before it can be read."]},{"id":17,"domain":"Management & governance","source":"PDF · Austin Q2","series":false,"fixed":false,"rebuilt":false,"text":["If an Azure virtual machine has a status of Stopped (deallocated), you will continue to pay for:"],"options":[{"key":"A","text":"memory"},{"key":"B","text":"the operating system license"},{"key":"C","text":"storage"},{"key":"D","text":"compute"}],"answer":"C","explanation":["Deallocated VMs release their compute (CPU/RAM), so compute is not billed. The managed disks (storage) still exist and are still billed."]},{"id":18,"domain":"Management & governance","source":"PDF · Austin Q3","series":false,"fixed":false,"rebuilt":false,"text":["An Azure policy states that administrators can create resources only in regions in the country where their office is located. What should you create to enforce this?"],"options":[{"key":"A","text":"an Azure Policy assignment"},{"key":"B","text":"a reservation"},{"key":"C","text":"a management group"},{"key":"D","text":"a read-only lock"}],"answer":"A","explanation":["Azure Policy can restrict resource properties at deployment, e.g., the built-in \"Allowed locations\" policy."]},{"id":19,"domain":"Architecture & services","source":"PDF · Austin Q4","series":false,"fixed":false,"rebuilt":true,"text":["Which Azure service runs application code in Azure without requiring you to manage a server?"],"options":[{"key":"A","text":"Azure Virtual Machines"},{"key":"B","text":"Azure Virtual Desktop"},{"key":"C","text":"Azure Dedicated Host"},{"key":"D","text":"Azure Functions"}],"answer":"D","explanation":["Azure Functions is serverless compute: you deploy code that runs on events and pay per execution; the infrastructure is fully managed."]},{"id":20,"domain":"Architecture & services","source":"PDF · Austin Q5","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure service should you use to store certificates?"],"options":[{"key":"A","text":"Azure Key Vault"},{"key":"B","text":"an Azure Storage account"},{"key":"C","text":"Azure Information Protection"},{"key":"D","text":"Microsoft Defender for Cloud"}],"answer":"A","explanation":["Azure Key Vault securely stores and manages secrets, keys and certificates."]},{"id":21,"domain":"Management & governance","source":"PDF · Austin Q6","series":false,"fixed":false,"rebuilt":true,"text":["Which offering provides access to unused Azure compute capacity at deep discounts, with the possibility of being evicted when Azure needs the capacity back?"],"options":[{"key":"A","text":"Azure Reserved Virtual Machine Instances"},{"key":"B","text":"Azure Spot Virtual Machines"},{"key":"C","text":"Azure Dedicated Host"},{"key":"D","text":"Azure Hybrid Benefit"}],"answer":"B","explanation":["Spot VMs use spare capacity at up to ~90% discount but can be evicted at any time, so they suit interruptible workloads (batch, dev/test)."]},{"id":22,"domain":"Management & governance","source":"PDF · Austin Q7","series":false,"fixed":false,"rebuilt":false,"text":["This question requires that you evaluate the underlined text to determine if it is correct.","Your Azure trial account expired last week. You are now unable to create additional Microsoft Entra user accounts.","Review the underlined text (\"create additional Microsoft Entra user accounts\"). If it makes the statement correct, select \"No change is needed\". Otherwise, select the answer choice that makes the statement correct."],"options":[{"key":"A","text":"No change is needed"},{"key":"B","text":"start an existing Azure virtual machine"},{"key":"C","text":"access your data stored in Azure"},{"key":"D","text":"access the Azure portal"}],"answer":"B","explanation":["When the free trial expires (and you don't upgrade), the subscription is disabled: you cannot start or create paid resources such as VMs. You can still sign in to the portal, and Entra ID (free tier) still lets you manage users."]},{"id":23,"domain":"Management & governance","source":"PDF · Austin Q8","series":false,"fixed":false,"rebuilt":true,"text":["From where can you access Microsoft Compliance Manager?"],"options":[{"key":"A","text":"the Microsoft Purview portal"},{"key":"B","text":"Azure Monitor"},{"key":"C","text":"the Azure Advisor blade in the Azure portal"},{"key":"D","text":"Microsoft Defender for Cloud"}],"answer":"A","explanation":["REBUILT. Compliance Manager is part of Microsoft Purview (compliance portal). It helps you track compliance with regulations and gives a compliance score."]},{"id":24,"domain":"Architecture & services","source":"PDF · Austin Q9","series":false,"fixed":false,"rebuilt":true,"text":["Which Azure Firewall rule type enables users on the internet to access a server on a virtual network?"],"options":[{"key":"A","text":"threat intelligence rules"},{"key":"B","text":"application rules"},{"key":"C","text":"DNAT (destination network address translation) rules"},{"key":"D","text":"network rules"}],"answer":"C","explanation":["REBUILT. DNAT rules translate inbound traffic on the firewall's public IP to a private IP/port of a server inside the VNet."]},{"id":25,"domain":"Architecture & services","source":"PDF · Cain Q1","series":false,"fixed":false,"rebuilt":true,"text":["Requiring a user to enter a password and then approve a sign-in notification in the Microsoft Authenticator app when signing in to Microsoft Entra ID is an example of:"],"options":[{"key":"A","text":"single sign-on (SSO)"},{"key":"B","text":"passwordless authentication"},{"key":"C","text":"multifactor authentication (MFA)"},{"key":"D","text":"role-based access control (RBAC)"}],"answer":"C","explanation":["REBUILT (the original used \"password + security question\", which are both \"something you know\" and therefore not true MFA). MFA combines factors from different categories: something you know (password), something you have (phone), something you are (biometrics)."]},{"id":26,"domain":"Cloud concepts","source":"PDF · Cain Q2","series":false,"fixed":false,"rebuilt":false,"text":["Microsoft 365 is an example of which cloud service model?"],"options":[{"key":"A","text":"software as a service (SaaS)"},{"key":"B","text":"platform as a service (PaaS)"},{"key":"C","text":"infrastructure as a service (IaaS)"}],"answer":"A","explanation":["Microsoft 365 is a finished application consumed over the internet; the provider manages everything except your data, users and devices."]},{"id":27,"domain":"Management & governance","source":"PDF · Cain Q3","series":false,"fixed":false,"rebuilt":true,"text":["To save on the costs of an unused Azure virtual machine that runs Windows 10, you should:"],"options":[{"key":"A","text":"stop (deallocate) the virtual machine from the Azure portal"},{"key":"B","text":"move the VM to another resource group"},{"key":"C","text":"remove the VM's network interface"},{"key":"D","text":"shut down the operating system from inside the VM"}],"answer":"A","explanation":["Stopping from the portal (or CLI/PowerShell) deallocates the VM so compute isn't billed. Shutting down from inside the OS leaves it \"Stopped\" but still allocated, so compute keeps being billed."]},{"id":28,"domain":"Architecture & services","source":"PDF · Cain Q4","series":false,"fixed":false,"rebuilt":false,"text":["Your company plans to migrate to Azure. All the Azure resources used by each department will be managed by a department administrator. You need to segment Azure for the departments.","What are two possible techniques? Each correct answer presents a complete solution. (Choose two.)"],"options":[{"key":"A","text":"multiple Microsoft Entra directories"},{"key":"B","text":"multiple subscriptions"},{"key":"C","text":"multiple resource groups"},{"key":"D","text":"multiple regions"}],"answer":"B, C","explanation":["Subscriptions and resource groups are both management/access-control boundaries where you can assign RBAC roles to each department administrator. Multiple directories would split identity and complicate management."]},{"id":29,"domain":"Architecture & services","source":"PDF · Cain Q5","series":true,"fixed":false,"rebuilt":false,"text":["You plan to deploy several Azure virtual machines. You need to ensure that the services running on the virtual machines are available if a single data center fails.","Solution: You deploy the virtual machines to two or more scale sets.","Does this meet the goal?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["Scale sets by themselves don't guarantee placement in different datacenters. You need availability zones (or multiple regions)."]},{"id":30,"domain":"Management & governance","source":"PDF · Cain Q6","series":false,"fixed":false,"rebuilt":false,"text":["This question requires that you evaluate the underlined text to determine if it is correct.","You have an Azure virtual network named VNET1 in a resource group named RG1. You assign an Azure policy specifying that virtual networks are not an allowed resource type in RG1. VNET1 is deleted automatically.","Review the underlined text (\"is deleted automatically\"). If it makes the statement correct, select \"No change is needed\". Otherwise, select the answer choice that makes the statement correct."],"options":[{"key":"A","text":"No change is needed."},{"key":"B","text":"is moved automatically to another resource group"},{"key":"C","text":"continues to function normally"},{"key":"D","text":"is now a read-only object"}],"answer":"C","explanation":["Existing resources that violate a new policy are flagged as non-compliant but are not deleted or changed (with the default \"deny\" effect). New ones are blocked."]},{"id":31,"domain":"Management & governance","source":"PDF · Cain Q7","series":false,"fixed":false,"rebuilt":false,"text":["Your company has 10 departments. You need to ensure that each department can use a different payment option for the Azure services it consumes.","What should you create for each department?"],"options":[{"key":"A","text":"a subscription"},{"key":"B","text":"a resource group"},{"key":"C","text":"a reservation"},{"key":"D","text":"a container instance"}],"answer":"A","explanation":["Billing happens per subscription; each subscription is tied to a billing account/offer, so separate subscriptions allow different payment options."]},{"id":32,"domain":"Management & governance","source":"PDF · Cain Q8","series":false,"fixed":false,"rebuilt":false,"text":["What is guaranteed in an Azure Service Level Agreement (SLA) for virtual machines?"],"options":[{"key":"A","text":"feature availability"},{"key":"B","text":"bandwidth"},{"key":"C","text":"performance"},{"key":"D","text":"uptime"}],"answer":"D","explanation":["SLAs define availability (uptime/connectivity) percentages, e.g., 99.99% for VMs across two or more availability zones."]},{"id":33,"domain":"Management & governance","source":"PDF · Cain Q9","series":false,"fixed":true,"rebuilt":false,"text":["Your company has an Azure subscription that contains several resources. You need to identify which department is responsible for the cost of each resource.","What should you use?"],"options":[{"key":"A","text":"budgets"},{"key":"B","text":"tags"},{"key":"C","text":"alerts"}],"answer":"B","explanation":["CORRECTED (the PDF said budgets). Tags (e.g., Department=Finance) are metadata you can group and filter by in Cost Management to attribute cost. Budgets only set spending thresholds."]},{"id":34,"domain":"Cloud concepts","source":"PDF · Cain Q11","series":false,"fixed":false,"rebuilt":false,"text":["Your company hosts an accounting application named App1 that is used by all its customers. App1 has low usage during the first three weeks of each month and very high usage during the last week.","Which benefit of Azure cloud services supports cost management for this type of usage pattern?"],"options":[{"key":"A","text":"high availability"},{"key":"B","text":"elasticity"},{"key":"C","text":"load balancing"},{"key":"D","text":"high latency"}],"answer":"B","explanation":["Elasticity automatically adds resources when demand rises and removes them when it drops, so you only pay for what you use."]},{"id":35,"domain":"Cloud concepts","source":"PDF · Gallegos Q1","series":false,"fixed":false,"rebuilt":false,"text":["You plan to provision infrastructure as a service (IaaS) resources in Azure. Which resource is an example of IaaS?"],"options":[{"key":"A","text":"an Azure web app"},{"key":"B","text":"an Azure SQL database"},{"key":"C","text":"an Azure virtual machine"},{"key":"D","text":"an Azure logic app"}],"answer":"C","explanation":["VMs are IaaS: you manage the OS and everything above it. Web apps, logic apps and Azure SQL Database are PaaS."]},{"id":36,"domain":"Management & governance","source":"PDF · Gallegos Q2","series":false,"fixed":false,"rebuilt":false,"text":["This question requires that you evaluate the underlined text to determine if it is correct.","If Microsoft plans to end support for an Azure service that does NOT have a successor service, Microsoft will provide notification at least 12 months before.","Review the underlined text (\"12 months\"). If it makes the statement correct, select \"No change is needed\". Otherwise, select the answer choice that makes the statement correct."],"options":[{"key":"A","text":"No change is needed."},{"key":"B","text":"6 months"},{"key":"C","text":"90 days"},{"key":"D","text":"30 days"}],"answer":"A","explanation":["Under the Modern Lifecycle Policy, Microsoft gives at least 12 months' notice before ending support for a service without a successor."]},{"id":37,"domain":"Management & governance","source":"PDF · Gallegos Q3","series":false,"fixed":false,"rebuilt":false,"text":["Your company plans to migrate all its network resources to Azure. You need to start the planning process by exploring Azure. What should you create first?"],"options":[{"key":"A","text":"a management group"},{"key":"B","text":"a virtual network"},{"key":"C","text":"a subscription"},{"key":"D","text":"a resource group"}],"answer":"C","explanation":["You need a subscription before you can create any resource group or resource."]},{"id":38,"domain":"Management & governance","source":"PDF · Gallegos Q4","series":false,"fixed":false,"rebuilt":false,"text":["This question requires that you evaluate the underlined text to determine if it is correct.","All Azure services that are in public preview are provided without any documentation.","Review the underlined text (\"provided without any documentation\"). If it makes the statement correct, select \"No change is needed\". Otherwise, select the answer choice that makes the statement correct."],"options":[{"key":"A","text":"No change is needed."},{"key":"B","text":"only configurable from Azure CLI"},{"key":"C","text":"excluded from the Service Level Agreements"},{"key":"D","text":"only configurable from the Azure portal"}],"answer":"C","explanation":["Preview features are offered \"as-is\", excluded from SLAs and possibly with limited support. They are documented and can be used from the portal, CLI, etc."]},{"id":39,"domain":"Architecture & services","source":"PDF · Gallegos Q5","series":false,"fixed":false,"rebuilt":false,"text":["This question requires that you evaluate the underlined text to determine if it is correct.","After you create a virtual machine, you need to modify the network security group to allow connections from TCP port 8080 to the virtual machine.","Review the underlined text (\"network security group\"). If it makes the statement correct, select \"No change is needed\". Otherwise, select the answer choice that makes the statement correct."],"options":[{"key":"A","text":"No change is needed."},{"key":"B","text":"virtual network gateway"},{"key":"C","text":"virtual network"},{"key":"D","text":"route table"}],"answer":"A","explanation":["NSGs contain inbound/outbound security rules that allow or deny traffic by port, protocol and IP. Adding an inbound rule for TCP 8080 is the fix."]},{"id":40,"domain":"Management & governance","source":"PDF · Gallegos Q6","series":false,"fixed":false,"rebuilt":false,"text":["You have an Azure web app. You need to manage the settings of the web app from an iPhone.","What are two Azure management tools that you can use? (Choose two.)"],"options":[{"key":"A","text":"Azure Storage Explorer"},{"key":"B","text":"Azure Cloud Shell"},{"key":"C","text":"Windows PowerShell"},{"key":"D","text":"the Azure portal"},{"key":"E","text":"Azure CLI"}],"answer":"B, D","explanation":["The portal and Cloud Shell run in any modern browser, including mobile Safari. CLI/PowerShell need to be installed on a computer. (The Azure mobile app is another option.)"]},{"id":41,"domain":"Cloud concepts","source":"PDF · Gallegos Q8","series":false,"fixed":false,"rebuilt":false,"text":["Your company has an on-premises network with multiple servers and plans to migrate several servers to Azure virtual machines. It wants to reduce these administrative responsibilities: backing up application data, replacing failed server hardware, managing physical server security, updating server operating systems, managing permissions to shared documents.","Which two responsibilities will be reduced after the migration? (Choose two.)"],"options":[{"key":"A","text":"Managing physical server security"},{"key":"B","text":"Backing up application data"},{"key":"C","text":"Updating server operating systems"},{"key":"D","text":"Replacing failed server hardware"},{"key":"E","text":"Managing permissions to shared documents"}],"answer":"A, D","explanation":["With IaaS, Microsoft is responsible for physical hardware and datacenter security. The customer still owns the OS, apps, data and access permissions."]},{"id":42,"domain":"Architecture & services","source":"PDF · Gallegos Q9","series":true,"fixed":false,"rebuilt":false,"text":["You plan to deploy several Azure virtual machines. You need to ensure that the services running on the virtual machines are available if a single data center fails.","Solution: You deploy the virtual machines to two or more regions.","Does this meet the goal?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Regions are made of separate datacenters, so a single datacenter failure cannot take down VMs in another region."]},{"id":43,"domain":"Architecture & services","source":"PDF · Gallegos Q11","series":false,"fixed":true,"rebuilt":false,"text":["What should you use to prevent traffic from an Azure virtual network to an Azure Storage account from being routed over the internet?"],"options":[{"key":"A","text":"Azure VPN Gateway"},{"key":"B","text":"a public endpoint"},{"key":"C","text":"a network security group (NSG)"},{"key":"D","text":"a service endpoint"}],"answer":"D","explanation":["CORRECTED (the PDF said NSG). A virtual network service endpoint sends traffic to the storage account over the Azure backbone using the VNet's identity. (A private endpoint would also achieve this.) An NSG filters traffic but doesn't change the route."]},{"id":44,"domain":"Management & governance","source":"PDF · Gallegos Q12","series":false,"fixed":true,"rebuilt":false,"text":["You need to compare a company's cloud usage to industry-standard best practices. What should you use?"],"options":[{"key":"A","text":"Application Insights in Azure Monitor"},{"key":"B","text":"Azure Service Health"},{"key":"C","text":"Azure Monitor"},{"key":"D","text":"Azure Advisor"}],"answer":"D","explanation":["CORRECTED (the PDF said Monitor). Advisor analyzes your configuration and usage and gives best-practice recommendations for reliability, security, performance, cost and operational excellence."]},{"id":45,"domain":"Management & governance","source":"PDF · Gillespie Q1","series":false,"fixed":false,"rebuilt":false,"text":["This question requires that you evaluate the underlined text to determine if it is correct.","You can use Advisor recommendations in Azure to send email alerts when the cost of the current billing period for an Azure subscription exceeds a specified limit.","Review the underlined text (\"Advisor recommendations\"). If it makes the statement correct, select \"No change is needed\". Otherwise, select the answer choice that makes the statement correct."],"options":[{"key":"A","text":"No change is needed."},{"key":"B","text":"Access control (IAM)"},{"key":"C","text":"Budget alerts"},{"key":"D","text":"Compliance"}],"answer":"C","explanation":["Cost Management budgets fire alerts (email/action groups) when spending reaches a threshold."]},{"id":46,"domain":"Architecture & services","source":"PDF · Campos Q1","series":false,"fixed":false,"rebuilt":false,"text":["You have an Azure subscription. You plan to create a virtual machine. Where will the virtual machine be placed in Azure?"],"options":[{"key":"A","text":"in an administrative unit"},{"key":"B","text":"in an application group"},{"key":"C","text":"in a resource group"},{"key":"D","text":"in a storage account"}],"answer":"C","explanation":["Every Azure resource must belong to exactly one resource group."]},{"id":47,"domain":"Architecture & services","source":"PDF · Campos Q2","series":true,"fixed":false,"rebuilt":false,"text":["You plan to deploy several Azure virtual machines. You need to ensure that the services running on the virtual machines are available if a single data center fails.","Solution: You deploy the virtual machines to two or more availability zones.","Does this meet the goal?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Availability zones are physically separate datacenter groups within a region, with independent power, cooling and networking."]},{"id":48,"domain":"Architecture & services","source":"PDF · Campos Q3","series":false,"fixed":false,"rebuilt":false,"text":["You plan to deploy several Azure virtual machines. You need to ensure that the services running on the virtual machines remain available if a single data center fails.","What are two possible solutions? (Choose two.)"],"options":[{"key":"A","text":"Deploy the virtual machines to a scale set."},{"key":"B","text":"Deploy the virtual machines to two or more availability zones."},{"key":"C","text":"Deploy the virtual machines to two or more regions."},{"key":"D","text":"Deploy the virtual machines to two or more resource groups."}],"answer":"B, C","explanation":["Zones and regions both place VMs in different datacenters. Resource groups are logical containers with no effect on physical placement."]},{"id":49,"domain":"Architecture & services","source":"PDF · Campos Q4","series":false,"fixed":false,"rebuilt":false,"text":["You need to collect and automatically analyze security events from Microsoft Entra ID. What should you use?"],"options":[{"key":"A","text":"Azure Synapse Analytics"},{"key":"B","text":"Microsoft Entra Connect"},{"key":"C","text":"Azure Key Vault"},{"key":"D","text":"Microsoft Sentinel"}],"answer":"D","explanation":["Microsoft Sentinel is a cloud-native SIEM/SOAR that collects security data (including Entra sign-in and audit logs) and analyzes it with analytics and AI."]},{"id":50,"domain":"Management & governance","source":"PDF · Campos Q5","series":true,"fixed":false,"rebuilt":false,"text":["An Azure administrator plans to run a PowerShell script that creates Azure resources. You need to recommend which computer configuration to use to run the script.","Solution: Run the script from a computer that runs Linux and has the Azure CLI tools installed.","Does this meet the goal?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["A PowerShell script needs PowerShell (with the Az module). Azure CLI is a different tool. (PowerShell 7 does run on Linux, but the given configuration only has the CLI.)"]},{"id":51,"domain":"Architecture & services","source":"PDF · Campos Q6","series":false,"fixed":false,"rebuilt":false,"text":["What can Azure Information Protection (now Microsoft Purview Information Protection) encrypt?"],"options":[{"key":"A","text":"an Azure Storage account"},{"key":"B","text":"network traffic"},{"key":"C","text":"an Azure SQL database"},{"key":"D","text":"documents and email messages"}],"answer":"D","explanation":["It classifies, labels and protects (encrypts) documents and emails, and the protection travels with the file."]},{"id":52,"domain":"Cloud concepts","source":"PDF · Campos Q7","series":false,"fixed":false,"rebuilt":false,"text":["This question requires that you evaluate the underlined text to determine if it is correct.","An organization that hosts its infrastructure in a private cloud can decommission its data center.","Review the underlined text (\"in a private cloud\"). If it makes the statement correct, select \"No change is needed\". Otherwise, select the answer choice that makes the statement correct."],"options":[{"key":"A","text":"No change is needed."},{"key":"B","text":"in a hybrid cloud"},{"key":"C","text":"in the public cloud"},{"key":"D","text":"on a Hyper-V host"}],"answer":"C","explanation":["A private cloud runs in your own datacenter, and a hybrid cloud still keeps part of it. Only moving everything to the public cloud lets you close the datacenter."]},{"id":53,"domain":"Architecture & services","source":"PDF · Campos Q8","series":false,"fixed":false,"rebuilt":false,"text":["What is a feature of an Azure virtual network?"],"options":[{"key":"A","text":"packet inspection"},{"key":"B","text":"resource cost analysis"},{"key":"C","text":"isolation and segmentation"},{"key":"D","text":"geo-redundancy"}],"answer":"C","explanation":["VNets provide isolation and segmentation (address spaces and subnets), internet communication, communication between Azure resources, on-premises connectivity and traffic filtering/routing."]},{"id":54,"domain":"Management & governance","source":"PDF · Boyle Q1","series":false,"fixed":false,"rebuilt":false,"text":["Who can use the Azure pricing and Total Cost of Ownership (TCO) calculators?"],"options":[{"key":"A","text":"users with a Microsoft Entra account linked to an Azure subscription only"},{"key":"B","text":"anyone"},{"key":"C","text":"owners of an Azure subscription only"},{"key":"D","text":"billing readers of an Azure subscription only"}],"answer":"B","explanation":["They are free public web tools; no Azure account or subscription is required."]},{"id":55,"domain":"Architecture & services","source":"PDF · Boyle Q4","series":true,"fixed":false,"rebuilt":false,"text":["Your Azure environment contains multiple Azure virtual machines. You need to ensure that a virtual machine named VM1 is accessible from the Internet over HTTP.","Solution: You modify a DDoS protection plan.","Does this meet the goal?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["DDoS protection mitigates attacks; it doesn't allow traffic. You need an NSG inbound rule for TCP 80 (and a public IP)."]},{"id":56,"domain":"Management & governance","source":"PDF · Boyle Q9","series":false,"fixed":false,"rebuilt":false,"text":["You have a resource group named RG1. You plan to create virtual networks and app services in RG1. You need to prevent the creation of virtual machines only in RG1.","What should you use?"],"options":[{"key":"A","text":"an Azure role"},{"key":"B","text":"a lock"},{"key":"C","text":"a tag"},{"key":"D","text":"an Azure policy"}],"answer":"D","explanation":["A policy such as \"Not allowed resource types\" assigned at RG1 blocks VM creation while allowing other types. Locks prevent deleting/modifying existing resources, not creating specific types."]},{"id":57,"domain":"Management & governance","source":"PDF · Boyle Q10","series":false,"fixed":false,"rebuilt":false,"text":["You need to be notified when Microsoft plans to perform maintenance that can affect the resources deployed to an Azure subscription. What should you use?"],"options":[{"key":"A","text":"Azure Monitor"},{"key":"B","text":"Microsoft Trust Center"},{"key":"C","text":"Azure Service Health"},{"key":"D","text":"Azure Advisor"}],"answer":"C","explanation":["Service Health shows service issues, planned maintenance and health advisories for the services and regions you use, and can send alerts."]},{"id":58,"domain":"Management & governance","source":"PDF · Boyle Q11","series":false,"fixed":false,"rebuilt":false,"text":["Which two features can be integrated with Azure Monitor? (Choose two.)"],"options":[{"key":"A","text":"Azure status"},{"key":"B","text":"Log Analytics"},{"key":"C","text":"Application Insights"},{"key":"D","text":"Azure Advisor"},{"key":"E","text":"Azure Service Health"}],"answer":"B, C","explanation":["Application Insights (application performance monitoring) and Log Analytics (log queries with KQL) are features of Azure Monitor."]},{"id":59,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which statement best describes cloud computing?"],"options":[{"key":"A","text":"The delivery of computing services (servers, storage, databases, networking, software) over the internet with pay-as-you-go pricing"},{"key":"B","text":"Running virtual machines on your own Hyper-V hosts"},{"key":"C","text":"Licensing software with a perpetual license"},{"key":"D","text":"Buying servers and hosting them in a third-party colocation facility"}],"answer":"A","explanation":["Cloud computing = computing services delivered over the internet, typically paying only for what you use."]},{"id":60,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["In the shared responsibility model, which responsibility ALWAYS remains with the customer, regardless of the service type (IaaS, PaaS or SaaS)?"],"options":[{"key":"A","text":"Physical hosts"},{"key":"B","text":"Operating system"},{"key":"C","text":"Information and data"},{"key":"D","text":"Network controls"}],"answer":"C","explanation":["For all deployment types the customer always owns the information and data, devices (mobile/PCs), and accounts and identities."]},{"id":61,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["In the shared responsibility model, which responsibility ALWAYS belongs to the cloud provider for services hosted in the cloud?"],"options":[{"key":"A","text":"Accounts and identities"},{"key":"B","text":"Physical datacenter, physical network and physical hosts"},{"key":"C","text":"Devices such as mobile phones and PCs"},{"key":"D","text":"Information and data"}],"answer":"B","explanation":["The physical datacenter, network and hosts are always the provider's responsibility in IaaS, PaaS and SaaS."]},{"id":62,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["You deploy an Azure virtual machine. Who is responsible for applying operating system updates to that VM?"],"options":[{"key":"A","text":"The customer"},{"key":"B","text":"The hardware vendor"},{"key":"C","text":"Microsoft"},{"key":"D","text":"Both Microsoft and the customer equally"}],"answer":"A","explanation":["With IaaS the customer manages the OS, including patching (you can automate it with tools like Azure Update Manager, but the responsibility is yours)."]},{"id":63,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["You use Azure SQL Database. Who is responsible for patching the database engine and operating system?"],"options":[{"key":"A","text":"The database administrator of the customer"},{"key":"B","text":"Microsoft"},{"key":"C","text":"Nobody; PaaS services are never patched"},{"key":"D","text":"The customer"}],"answer":"B","explanation":["Azure SQL Database is PaaS. Microsoft manages the OS and the database engine; you manage your data, schema, access and configuration."]},{"id":64,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which cloud deployment model is owned and used by a single organization, typically hosted in its own datacenter?"],"options":[{"key":"A","text":"Multi-cloud"},{"key":"B","text":"Private cloud"},{"key":"C","text":"Public cloud"},{"key":"D","text":"Hybrid cloud"}],"answer":"B","explanation":["A private cloud is used by one organization and gives maximum control, but the organization pays for and maintains the hardware."]},{"id":65,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which cloud deployment model has NO capital expenditure (CapEx) to scale up and lets you pay only for what you use, with resources owned by a provider?"],"options":[{"key":"A","text":"Public cloud"},{"key":"B","text":"Hybrid cloud"},{"key":"C","text":"Private cloud"},{"key":"D","text":"On-premises datacenter"}],"answer":"A","explanation":["In the public cloud the provider owns the hardware; you consume it as an operational expense."]},{"id":66,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company must keep some legacy systems on-premises because of regulations but wants to use Azure for new applications, with both environments connected. Which model should it use?"],"options":[{"key":"A","text":"Public cloud"},{"key":"B","text":"Community cloud"},{"key":"C","text":"Hybrid cloud"},{"key":"D","text":"Private cloud"}],"answer":"C","explanation":["Hybrid cloud combines private and public clouds so workloads can run in the most appropriate location."]},{"id":67,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company uses Azure for some workloads and another cloud provider for others. Which term describes this?"],"options":[{"key":"A","text":"Multi-cloud"},{"key":"B","text":"Sovereign cloud"},{"key":"C","text":"Private cloud"},{"key":"D","text":"Hybrid cloud"}],"answer":"A","explanation":["Multi-cloud means using more than one public cloud provider."]},{"id":68,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which Azure service lets you manage servers, Kubernetes clusters and databases running on-premises or in other clouds as if they were running in Azure?"],"options":[{"key":"A","text":"Azure VMware Solution"},{"key":"B","text":"Azure Migrate"},{"key":"C","text":"Azure Stack Edge"},{"key":"D","text":"Azure Arc"}],"answer":"D","explanation":["Azure Arc extends Azure management (Policy, RBAC, Monitor, etc.) to resources outside Azure: hybrid and multi-cloud."]},{"id":69,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company runs VMware workloads on-premises and wants to move them to Azure without converting the virtual machines. Which service should it use?"],"options":[{"key":"A","text":"Azure Dedicated Host"},{"key":"B","text":"Azure VMware Solution"},{"key":"C","text":"Azure Arc"},{"key":"D","text":"Azure Virtual Desktop"}],"answer":"B","explanation":["Azure VMware Solution runs native VMware vSphere workloads on dedicated bare-metal Azure infrastructure."]},{"id":70,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which type of expense is buying servers for your own datacenter?"],"options":[{"key":"A","text":"Consumption-based expense"},{"key":"B","text":"Operational expenditure (OpEx)"},{"key":"C","text":"Variable expense"},{"key":"D","text":"Capital expenditure (CapEx)"}],"answer":"D","explanation":["CapEx is a one-time, up-front spend on physical infrastructure that is depreciated over time."]},{"id":71,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which type of expense is paying a monthly bill for the Azure resources you used?"],"options":[{"key":"A","text":"Depreciating expense"},{"key":"B","text":"Fixed expense"},{"key":"C","text":"Capital expenditure (CapEx)"},{"key":"D","text":"Operational expenditure (OpEx)"}],"answer":"D","explanation":["Cloud consumption is OpEx: you spend on services as you use them and can deduct it in the same period."]},{"id":72,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which statement describes the consumption-based model?"],"options":[{"key":"A","text":"You pay per user regardless of how many resources are used"},{"key":"B","text":"You pay only for the resources you use, with no up-front costs"},{"key":"C","text":"You must buy hardware before using services"},{"key":"D","text":"You pay a fixed annual fee regardless of usage"}],"answer":"B","explanation":["The consumption-based model means no up-front cost, no need to buy and manage infrastructure, and the ability to stop paying when you no longer need resources."]},{"id":73,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: The cloud's pay-as-you-go model means you must estimate and buy capacity for peak demand in advance.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["No. That is the on-premises model. In the cloud you can scale on demand and pay for actual usage."]},{"id":74,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which cloud benefit describes the ability to add more resources to handle increased demand?"],"options":[{"key":"A","text":"Manageability"},{"key":"B","text":"Predictability"},{"key":"C","text":"Scalability"},{"key":"D","text":"Governance"}],"answer":"C","explanation":["Scalability is the ability to adjust resources to meet demand. Elasticity is when that happens automatically."]},{"id":75,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["You increase the number of CPUs and memory of an existing virtual machine. Which type of scaling is this?"],"options":[{"key":"A","text":"Geo-scaling"},{"key":"B","text":"Vertical scaling (scaling up)"},{"key":"C","text":"Elastic scaling"},{"key":"D","text":"Horizontal scaling (scaling out)"}],"answer":"B","explanation":["Vertical scaling adds capabilities to an existing resource (more CPU/RAM). Horizontal scaling adds or removes instances."]},{"id":76,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["You add three more virtual machine instances behind a load balancer to handle more traffic. Which type of scaling is this?"],"options":[{"key":"A","text":"Horizontal scaling (scaling out)"},{"key":"B","text":"Scaling down"},{"key":"C","text":"Vertical scaling (scaling up)"},{"key":"D","text":"Fault tolerance"}],"answer":"A","explanation":["Adding more instances is horizontal scaling (scale out); removing them is scale in."]},{"id":77,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which cloud benefit refers to keeping applications running and accessible with minimal downtime, typically measured in uptime percentage?"],"options":[{"key":"A","text":"Scalability"},{"key":"B","text":"Agility"},{"key":"C","text":"High availability"},{"key":"D","text":"Elasticity"}],"answer":"C","explanation":["High availability focuses on ensuring maximum availability regardless of disruptions, usually expressed with an SLA percentage."]},{"id":78,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which cloud benefit describes the ability of a system to recover from failures and continue to function?"],"options":[{"key":"A","text":"Manageability"},{"key":"B","text":"Reliability"},{"key":"C","text":"Predictability"},{"key":"D","text":"Elasticity"}],"answer":"B","explanation":["Reliability is the ability to recover from failures and keep functioning; the cloud's decentralized design (regions, zones) helps."]},{"id":79,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which two concepts make up the \"predictability\" benefit of the cloud? (Choose two.)"],"options":[{"key":"A","text":"Performance predictability"},{"key":"B","text":"Security predictability"},{"key":"C","text":"Compliance predictability"},{"key":"D","text":"Cost predictability"}],"answer":"A, D","explanation":["Predictability in the cloud is about performance (autoscaling, load balancing, high availability) and cost (forecasting with tools like the pricing calculator and Cost Management)."]},{"id":80,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which two aspects are part of \"manageability\" in the cloud? (Choose two.)"],"options":[{"key":"A","text":"Management of physical datacenter security"},{"key":"B","text":"Management OF the cloud (managing your resources, e.g., autoscaling, monitoring, templates)"},{"key":"C","text":"Management of hardware procurement"},{"key":"D","text":"Management IN the cloud (how you manage it: portal, CLI, APIs, PowerShell)"}],"answer":"B, D","explanation":["Microsoft describes cloud manageability as management of the cloud (what you can do with resources) and management in the cloud (the tools you use)."]},{"id":81,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company wants to deploy resources that are automatically compliant with corporate standards and can be audited. Which cloud benefit does this describe?"],"options":[{"key":"A","text":"Elasticity"},{"key":"B","text":"Agility"},{"key":"C","text":"Scalability"},{"key":"D","text":"Governance and compliance"}],"answer":"D","explanation":["Cloud features like templates and policies help ensure resources meet corporate and regulatory standards."]},{"id":82,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which statement about security in the different service models is correct?"],"options":[{"key":"A","text":"IaaS gives you the most control over security of the OS and software; PaaS and SaaS shift more security responsibility to the provider"},{"key":"B","text":"SaaS gives the customer the most control over OS security"},{"key":"C","text":"PaaS requires the customer to patch the underlying OS"},{"key":"D","text":"In all models the customer is responsible for physical security"}],"answer":"A","explanation":["More control (IaaS) also means more responsibility. PaaS/SaaS handle patches automatically."]},{"id":83,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service model provides the MOST control and flexibility over the computing resources?"],"options":[{"key":"A","text":"Platform as a service (PaaS)"},{"key":"B","text":"Infrastructure as a service (IaaS)"},{"key":"C","text":"Function as a service (FaaS)"},{"key":"D","text":"Software as a service (SaaS)"}],"answer":"B","explanation":["IaaS gives you control of the OS and everything above it, making it the most flexible model."]},{"id":84,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A development team wants to deploy web applications without managing operating systems, patches or runtime updates. Which service model should they use?"],"options":[{"key":"A","text":"Software as a service (SaaS)"},{"key":"B","text":"Platform as a service (PaaS)"},{"key":"C","text":"On-premises hosting"},{"key":"D","text":"Infrastructure as a service (IaaS)"}],"answer":"B","explanation":["PaaS provides a managed platform (OS, runtime, middleware) so developers focus on code and data."]},{"id":85,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which scenario is the BEST fit for infrastructure as a service (IaaS)?"],"options":[{"key":"A","text":"Using a CRM application through a browser"},{"key":"B","text":"Lift-and-shift migration of on-premises servers to the cloud"},{"key":"C","text":"Using a hosted email service"},{"key":"D","text":"Building a web app without managing the OS"}],"answer":"B","explanation":["Lift-and-shift moves existing VMs as they are, which maps directly to IaaS."]},{"id":86,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which of the following is an example of software as a service (SaaS)?"],"options":[{"key":"A","text":"Azure App Service"},{"key":"B","text":"Azure Kubernetes Service"},{"key":"C","text":"Microsoft Outlook (Exchange Online) email"},{"key":"D","text":"Azure Virtual Machines"}],"answer":"C","explanation":["SaaS is a complete application delivered over the internet: email, Microsoft 365, CRM, etc."]},{"id":87,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Azure App Service is an example of which cloud service model?"],"options":[{"key":"A","text":"On-premises"},{"key":"B","text":"SaaS"},{"key":"C","text":"PaaS"},{"key":"D","text":"IaaS"}],"answer":"C","explanation":["App Service is a fully managed platform for hosting web apps and APIs."]},{"id":88,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which service model requires the LEAST management effort from the customer?"],"options":[{"key":"A","text":"PaaS"},{"key":"B","text":"Private cloud"},{"key":"C","text":"IaaS"},{"key":"D","text":"SaaS"}],"answer":"D","explanation":["In SaaS the provider manages the application, platform and infrastructure; the customer mainly manages data, users and devices."]},{"id":89,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What does \"serverless\" computing mean?"],"options":[{"key":"A","text":"The application runs without any servers at all"},{"key":"B","text":"Code must run inside a virtual machine you manage"},{"key":"C","text":"Servers are installed on-premises and managed by the customer"},{"key":"D","text":"The cloud provider manages the servers, and you pay only when your code runs; you don't provision or manage servers"}],"answer":"D","explanation":["Servers still exist, but they are abstracted away. Azure Functions and Logic Apps are serverless examples."]},{"id":90,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Serverless compute such as Azure Functions is generally considered part of which service model?"],"options":[{"key":"A","text":"PaaS"},{"key":"B","text":"IaaS"},{"key":"C","text":"Private cloud"},{"key":"D","text":"SaaS"}],"answer":"A","explanation":["Microsoft places serverless under PaaS: the platform is managed and you only supply code or workflows."]},{"id":91,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which benefit allows a company to deploy applications in regions close to customers anywhere in the world within minutes?"],"options":[{"key":"A","text":"Disaster recovery"},{"key":"B","text":"Fault tolerance"},{"key":"C","text":"Vertical scaling"},{"key":"D","text":"Global reach"}],"answer":"D","explanation":["Cloud providers have datacenters around the world, so you can deploy close to users quickly."]},{"id":92,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which term describes the ability to quickly provision and deprovision resources to experiment and respond to business changes?"],"options":[{"key":"A","text":"Predictability"},{"key":"B","text":"Fault tolerance"},{"key":"C","text":"Durability"},{"key":"D","text":"Agility"}],"answer":"D","explanation":["Agility: resources can be deployed and configured quickly as requirements change."]},{"id":93,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is fault tolerance?"],"options":[{"key":"A","text":"The ability to forecast costs"},{"key":"B","text":"The ability of a service to remain operational when a component fails, by having redundant components take over"},{"key":"C","text":"The ability to scale out automatically"},{"key":"D","text":"The ability to recover data after it is deleted"}],"answer":"B","explanation":["Fault tolerance means redundancy so that a failure in one component doesn't stop the service."]},{"id":94,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is disaster recovery?"],"options":[{"key":"A","text":"A pricing model for discounted compute"},{"key":"B","text":"The ability to restore services and data after a major event, such as a region outage, using backup and replication"},{"key":"C","text":"Protection against DDoS attacks only"},{"key":"D","text":"The ability to add CPUs to a VM"}],"answer":"B","explanation":["Disaster recovery uses backup, replication and geographic distribution to recover from catastrophic events."]},{"id":95,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A website experiences unpredictable traffic spikes. The company wants resources to be added automatically during spikes and removed afterwards. Which cloud characteristic does this describe?"],"options":[{"key":"A","text":"Agility"},{"key":"B","text":"Predictability"},{"key":"C","text":"Durability"},{"key":"D","text":"Elasticity"}],"answer":"D","explanation":["Elasticity is the automatic scaling of resources up and down based on demand."]},{"id":96,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which TWO are benefits of moving from a private datacenter to the public cloud? (Choose two.)"],"options":[{"key":"A","text":"Ability to scale on demand"},{"key":"B","text":"Guaranteed zero downtime"},{"key":"C","text":"No up-front hardware costs"},{"key":"D","text":"Full control of the physical hardware"}],"answer":"A, C","explanation":["Public cloud removes CapEx and offers on-demand scaling. You lose physical control, and no cloud guarantees zero downtime."]},{"id":97,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: In a private cloud, the organization is responsible for hardware purchase, maintenance and updates.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. A private cloud gives control but also all the responsibility and costs of the hardware."]},{"id":98,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: A hybrid cloud lets you decide where to run each application based on security, compliance or legal requirements.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Flexibility to choose where each workload runs is a key benefit of hybrid cloud."]},{"id":99,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: In a public cloud, you can deploy resources and pay only for what you use, but you don't have complete control of the hardware.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. The provider owns and manages the physical resources."]},{"id":100,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: With platform as a service (PaaS), the customer is responsible for patching the operating system.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"B","explanation":["No. In PaaS the provider manages the OS; the customer manages applications, data and access."]},{"id":101,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Statement: With software as a service (SaaS), the customer is responsible for the accounts and identities used to access the application.","Is the statement true?"],"options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"answer":"A","explanation":["Yes. Accounts and identities, data and devices always remain the customer's responsibility."]},{"id":102,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which cloud service model would a company use to rent a fully featured CRM application that it accesses through a web browser?"],"options":[{"key":"A","text":"PaaS"},{"key":"B","text":"Hybrid"},{"key":"C","text":"IaaS"},{"key":"D","text":"SaaS"}],"answer":"D","explanation":["A ready-to-use application accessed over the internet is SaaS (e.g., Dynamics 365)."]},{"id":103,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which model is MOST appropriate for a startup that wants to test a new idea quickly with minimal cost if the idea fails?"],"options":[{"key":"A","text":"Buying servers with a 5-year lease"},{"key":"B","text":"Colocation with purchased hardware"},{"key":"C","text":"Public cloud with consumption-based pricing"},{"key":"D","text":"Building a private datacenter"}],"answer":"C","explanation":["No up-front investment and the ability to delete resources and stop paying make the public cloud ideal for experimentation."]},{"id":104,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["What is an advantage of the cloud's economies of scale?"],"options":[{"key":"A","text":"Customers get dedicated physical servers at no extra cost"},{"key":"B","text":"Customers must buy more hardware"},{"key":"C","text":"Costs increase as more customers join"},{"key":"D","text":"Providers buy at massive scale and pass lower costs to customers"}],"answer":"D","explanation":["Large providers achieve lower per-unit costs and pass some of those savings on."]},{"id":105,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which of these is an example of horizontal scaling done automatically?"],"options":[{"key":"A","text":"Adding a data disk to a VM"},{"key":"B","text":"Changing a VM size from D2s to D8s"},{"key":"C","text":"Moving a VM to another region"},{"key":"D","text":"An Azure virtual machine scale set adding instances when CPU usage exceeds 75%"}],"answer":"D","explanation":["Autoscale rules in scale sets automatically add (scale out) or remove (scale in) instances."]},{"id":106,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which statement about high availability in Azure is correct?"],"options":[{"key":"A","text":"Each Azure service has a Service Level Agreement (SLA) that states its guaranteed availability percentage"},{"key":"B","text":"SLAs only apply to on-premises resources"},{"key":"C","text":"All Azure services have a 100% SLA"},{"key":"D","text":"Free services have the highest SLA"}],"answer":"A","explanation":["SLAs vary per service and configuration. Free and preview services typically have no SLA."]},{"id":107,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["Which is a characteristic of the private cloud?"],"options":[{"key":"A","text":"Resources are shared among many organizations"},{"key":"B","text":"It never requires hardware"},{"key":"C","text":"It can be hosted in the organization's own datacenter or by a third party, but its resources are dedicated to one organization"},{"key":"D","text":"It is always cheaper than public cloud"}],"answer":"C","explanation":["Private cloud = dedicated resources for one organization, on-premises or hosted."]},{"id":108,"domain":"Cloud concepts","source":"New","series":false,"fixed":false,"rebuilt":false,"text":["A company wants to keep its existing on-premises investment while gaining extra capacity
